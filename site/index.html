<style>
/* Quadrangle, the user's own system from the Walking Thoughts field manual, applied to a
   conference survey sheet. Deliberately single-theme: dusk forest, every colour explicit.
   Layout: route, don't review. The guide proposes, you confirm, and a decision lands on
   your calendar and on the floor plan in the same gesture. */
:root {
  color-scheme: dark;
  --ground: #17231b;
  --deep: #101712;
  --surface: #1e2c22;
  --raised: #24352a;
  --ink: #f2f1e8;
  --ink-muted: #b9bcae;
  --line: rgba(242, 241, 232, 0.16);
  --line-strong: rgba(242, 241, 232, 0.38);
  --action: #f4cf72;      /* the armed choice; your calendar */
  --identity: #a9d18f;    /* a GO call */
  --attention: #f0b4a0;   /* clashes and tight changes */
  --machine: #8fb8d8;     /* what the guide says; links */
  --on-action: #17231b;
  --sheet: #ffffff;       /* the plans are printed on white */
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue Condensed", system-ui, sans-serif;
  --capture: Georgia, "Times New Roman", serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; }
body {
  background: var(--ground); color: var(--ink); font: .98rem/1.55 var(--body); -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 4rem;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ground); }
.sheet { max-width: 68rem; margin-inline: auto; display: grid; grid-template-columns: minmax(0, 1fr); }
.sheet > * { min-width: 0; }
a { color: var(--machine); }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--identity); outline-offset: 2px; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

.mono { font: 700 .66rem/1.4 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-muted); }
h2 { font: 600 1.7rem/1.05 var(--display); letter-spacing: .04em; text-transform: uppercase; margin: 0; text-wrap: balance; }
.lede { color: var(--ink-muted); max-width: 42rem; }
.linkish { background: none; border: 0; padding: 0; color: var(--machine); text-decoration: underline; text-underline-offset: .15em; font-size: .86rem; }
.linkish:hover { color: var(--ink); }

/* Masthead */
.masthead { text-align: center; padding-block: clamp(1.6rem, 5vw, 2.8rem) 1.1rem; border-bottom: 1px solid var(--line-strong); }
.masthead .agency { letter-spacing: .3em; margin-bottom: .8rem; font-size: .62rem; }
.masthead h1 { font: 600 clamp(2rem, 7vw, 3.1rem)/.95 var(--display); letter-spacing: .03em; text-transform: uppercase; text-wrap: balance; margin: 0; }
.masthead .sub { font: italic 1.04rem/1.45 var(--capture); color: var(--ink-muted); margin: .8rem auto 0; max-width: 34rem; }
@media (max-width: 40rem) { .masthead { padding-block: 1.1rem .7rem; } .masthead .sub { display: none; } .masthead .agency { margin-bottom: .5rem; } }
.marginalia { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .3rem 1rem; padding-block: .6rem; }
.marginalia a { color: var(--ink-muted); }

/* View tabs */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ground); border-block: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: .7rem .2rem .55rem; font: 600 1.1rem/1.1 var(--display); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-muted); }
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--action); border-bottom-color: var(--action); }
.tab .n { font: 700 .66rem/1 var(--mono); letter-spacing: .04em; margin-left: .3rem; font-variant-numeric: tabular-nums; }
@media (max-width: 26rem) { .tab { font-size: .98rem; letter-spacing: .02em; } .tab .n { display: block; margin: .2rem 0 0; } }
.view { display: grid; gap: 1.4rem; padding-top: 1.6rem; min-width: 0; }
.view > * { min-width: 0; }
.view-head { display: grid; gap: .45rem; }

/* Day and level selectors */
.chips { display: flex; gap: .35rem; overflow-x: auto; scrollbar-width: none; padding-block: 2px; }
.chip { flex: none; background: none; border: 1px solid var(--line-strong); padding: .42rem .7rem; font: 700 .72rem/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; font-variant-numeric: tabular-nums; color: var(--ink); }
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--action); border-color: var(--action); color: var(--on-action); }
.chip .sub { font-weight: 500; opacity: .75; margin-left: .35rem; }

/* The call */
.pill { display: inline-block; font: 700 .6rem/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; border: 1px solid currentColor; border-radius: 999px; padding: .12rem .5rem; white-space: nowrap; }
.call-go { color: var(--identity); }
.call-maybe { color: var(--machine); }
.call-skip { color: var(--ink-muted); }
.warn { color: var(--attention); }
.yours { color: var(--action); }

/* One talk at a time */
.card { background: var(--surface); border: 1px solid var(--line); border-top: 2px solid var(--action); padding: clamp(1rem, 3vw, 1.6rem); display: grid; gap: 1rem; }
.card > * { min-width: 0; }
.card h3 { font: 600 clamp(1.7rem, 4.6vw, 2.5rem)/1 var(--display); letter-spacing: .025em; text-transform: uppercase; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.where { font: 600 .92rem/1.4 var(--body); }
.where .floor { color: var(--ink-muted); font-weight: 400; }
.speakers { color: var(--ink-muted); font-size: .92rem; overflow-wrap: anywhere; }
.rule { background: var(--raised); border-left: 3px solid var(--identity); padding: .85rem 1rem; display: grid; gap: .35rem; }
.rule.maybe { border-left-color: var(--machine); }
.rule.skip { border-left-color: var(--ink-muted); }
.rule.clash { border-left-color: var(--attention); }
.rule .mono.call-go { color: var(--identity); }
.rule .mono.call-maybe { color: var(--machine); }
.actions { display: flex; flex-wrap: wrap; gap: .5rem; }
.act { flex: 1 1 auto; min-height: 2.9rem; background: none; border: 1px solid var(--line-strong); padding: .55rem .95rem; font: 600 1.08rem/1.1 var(--display); letter-spacing: .05em; text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; gap: .55rem; }
.act:hover { border-color: var(--ink); }
.act.armed { background: var(--action); border-color: var(--action); color: var(--on-action); }
kbd { font: 700 .66rem/1 var(--mono); border: 1px solid currentColor; border-radius: 4px; padding: .14rem .36rem; opacity: .8; }
@media (hover: none) { kbd { display: none; } .keyhelp { display: none; } }
.progress { display: flex; justify-content: space-between; gap: .3rem 1rem; flex-wrap: wrap; align-items: baseline; }
.meter { height: 3px; background: var(--line); }
.meter i { display: block; height: 100%; background: var(--action); }
.flash { display: flex; flex-wrap: wrap; gap: .2rem .7rem; align-items: baseline; font-size: .9rem; color: var(--ink-muted); }
details > summary { cursor: pointer; font-size: .86rem; color: var(--machine); }
details > div { display: grid; gap: .6rem; padding-top: .5rem; max-width: 42rem; }
.same { display: grid; gap: .1rem; }
.same button { display: grid; grid-template-columns: 4rem minmax(0, 1fr); gap: .6rem; align-items: baseline; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: .5rem 0; width: 100%; }
.same button:hover .tt { color: var(--action); }
.same .tt { font-size: .92rem; font-weight: 600; overflow-wrap: anywhere; }

/* Receipts */
.receipts { display: grid; gap: 1.4rem 2.4rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 19rem), 1fr)); align-items: start; }
.receipts > div { display: grid; gap: .1rem; min-width: 0; }
.receipt { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .6rem; align-items: baseline; border-top: 1px solid var(--line); padding: .45rem 0; font-size: .9rem; }
.receipt span { overflow-wrap: anywhere; }

/* Talks */
.filters { display: flex; flex-wrap: wrap; gap: .5rem; }
.filters input, .filters select { background: var(--deep); border: 1px solid var(--line-strong); padding: .5rem .6rem; font-size: .92rem; min-width: 0; }
.filters input { flex: 1 1 12rem; }
.filters select { flex: 0 1 11rem; }
.slot { display: grid; grid-template-columns: 5.2rem minmax(0, 1fr); gap: .8rem; border-top: 1px solid var(--line-strong); padding-top: .7rem; }
.slot > time { font: 700 .76rem/1.7 var(--mono); font-variant-numeric: tabular-nums; }
.items { display: grid; gap: 1.1rem; min-width: 0; }
.talk { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .2rem .7rem; }
.talk > * { min-width: 0; }
.talk .t { font: 600 1.28rem/1.12 var(--display); letter-spacing: .015em; overflow-wrap: anywhere; }
.talk .line { font-size: .86rem; color: var(--ink-muted); grid-column: 1; overflow-wrap: anywhere; }
.talk .why { font-size: .9rem; grid-column: 1; max-width: 44rem; }
.talk details { grid-column: 1 / -1; }
.talk.is-skip .t, .talk.is-skip .why { color: var(--ink-muted); }
.minor { color: var(--ink-muted); font-size: .88rem; }
.star { grid-column: 2; grid-row: 1 / span 3; align-self: start; background: none; border: 1px solid var(--line); min-width: 2.6rem; min-height: 2.6rem; font-size: 1.15rem; line-height: 1; color: var(--ink-muted); }
.star:hover { border-color: var(--action); color: var(--action); }
.star[aria-pressed="true"] { background: var(--action); border-color: var(--action); color: var(--on-action); }
.notes { display: grid; gap: .8rem; border-top: 1px solid var(--line-strong); padding-top: 1.2rem; font-size: .88rem; color: var(--ink-muted); }
.notes ul { margin: 0; padding-left: 1.1rem; display: grid; gap: .35rem; }

/* Calendar */
.next { background: var(--raised); border-left: 3px solid var(--action); padding: .9rem 1.1rem; display: grid; gap: .3rem; }
.next strong { font: 600 1.35rem/1.1 var(--display); letter-spacing: .02em; overflow-wrap: anywhere; }
.toolbar { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; }
.days { display: grid; gap: 2rem 1.6rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 19rem), 1fr)); align-items: start; }
.day-col { display: grid; gap: .1rem; min-width: 0; }
.day-col .linkish { justify-self: start; }
.day-col h3 { font: 600 1.35rem/1 var(--display); letter-spacing: .04em; text-transform: uppercase; margin: 0 0 .5rem; display: flex; justify-content: space-between; gap: .6rem; align-items: baseline; }
.ev { border-top: 1px solid var(--line); padding: .6rem 0; display: grid; grid-template-columns: 4.6rem minmax(0, 1fr); gap: .1rem .6rem; }
.ev > time { font: 700 .72rem/1.7 var(--mono); font-variant-numeric: tabular-nums; color: var(--action); }
.ev .body { display: grid; gap: .2rem; min-width: 0; }
.ev .t { font: 600 1.14rem/1.14 var(--display); letter-spacing: .015em; overflow-wrap: anywhere; }
.ev .line { font-size: .84rem; color: var(--ink-muted); overflow-wrap: anywhere; }
.ev .ctl { display: flex; flex-wrap: wrap; gap: .1rem .9rem; }
.ev.quiet > time { color: var(--ink-muted); font-weight: 500; }
.ev.quiet { padding-block: .35rem; }
.ev.quiet .body { color: var(--ink-muted); font-size: .84rem; }
.empty { border: 1px dashed var(--line-strong); padding: 1.1rem; display: grid; gap: .6rem; justify-items: start; color: var(--ink-muted); }
.empty .act { flex: 0 1 auto; color: var(--ink); }

/* Map */
.map-cols { display: grid; gap: 1.4rem 2.2rem; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 60rem) { .map-cols { grid-template-columns: minmax(0, 1fr) 21rem; } }
.map-col { display: grid; gap: .5rem; min-width: 0; }
.map-frame { background: var(--sheet); border: 1px solid var(--line-strong); overflow: auto; max-height: 92vh; }
.map-sheet { position: relative; width: 100%; }
.map-frame.zoomed .map-sheet { width: 250%; }
.map-sheet img { display: block; width: 100%; max-width: none; height: auto; }
.map-sheet svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.room-mark { fill: #f4cf72; fill-opacity: .5; stroke: #17231b; mix-blend-mode: multiply; }
.room-mark.looked { fill: #f0b4a0; }
.pin-bg { fill: #17231b; }
.pin-bg.looked { fill: #8a3a24; }
.pin-tx { fill: #f4cf72; font-family: var(--mono); font-weight: 700; text-anchor: middle; dominant-baseline: central; }
.pin-tx.looked { fill: #ffffff; }
.side { display: grid; gap: 1.3rem; min-width: 0; }
.side > div, .side > details { display: grid; gap: .35rem; }
.side ul { margin: 0; padding-left: 1.1rem; display: grid; gap: .35rem; font-size: .88rem; }
.route { font-size: .88rem; }
.route b { font-weight: 600; }
.stop { display: grid; grid-template-columns: 1.7rem minmax(0, 1fr); gap: .55rem; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: .55rem 0; width: 100%; align-items: start; }
.stop:hover .t { color: var(--action); }
.stop .num { font: 700 .72rem/1.65rem var(--mono); text-align: center; background: var(--deep); border: 1px solid var(--action); color: var(--action); height: 1.7rem; border-radius: 999px; }
.stop.looked .num { border-color: var(--attention); color: var(--attention); }
.stop .t { display: block; font: 600 1.05rem/1.14 var(--display); letter-spacing: .015em; overflow-wrap: anywhere; }
.stop .line { display: block; font-size: .8rem; color: var(--ink-muted); overflow-wrap: anywhere; }

.colophon { margin-top: 2.6rem; padding-top: .9rem; border-top: 1px solid var(--line-strong); display: flex; flex-wrap: wrap; justify-content: space-between; gap: .4rem 1rem; font-size: .6rem; }
@media (max-width: 30rem) { .slot { grid-template-columns: minmax(0, 1fr); gap: .3rem; } }
/* The site's top bar. Linked by every generated page, inlined into the field
   guide by render-site.ts, and loaded by the talk runtime. Colours are literal
   so it reads the same under either token set. */
.topnav {
  display: flex; align-items: center; gap: .15rem; overflow-x: auto; scrollbar-width: none;
  max-width: 68rem; margin: 0 auto; padding: .55rem 0;
  border-bottom: 1px solid rgba(242, 241, 232, 0.16);
  font: 600 1.02rem/1 "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  letter-spacing: .05em; text-transform: uppercase;
}
.topnav::-webkit-scrollbar { display: none; }
.topnav a { color: #b9bcae; text-decoration: none; padding: .45rem .6rem; border-radius: 999px; white-space: nowrap; }
.topnav a:hover { color: #f2f1e8; }
.topnav a[aria-current="page"] { color: #17231b; background: #f4cf72; }
.topnav .brand { color: #f2f1e8; margin-right: auto; padding-left: 0; letter-spacing: .08em; }
.topnav a:focus-visible { outline: 2px solid #a9d18f; outline-offset: 2px; }
@media (max-width: 34rem) {
  .topnav .brand { display: none; }
  .topnav { justify-content: space-between; font-size: .95rem; }
  .topnav a { padding: .45rem .45rem; }
}

</style>

pe. This session asks where we are on the curve for trusting agents, and what has to be true before we hand them much more work. It draws on decades of trust research, from how societies learned to trust strangers to how pilots learned to trust the autopilot. Then we use Claude Managed Agents as a reference implementation for building systems that are safe, secure and trustworthy by default.","format":"workshop","room":"continental-4-workshop-room-2","note":null,"day":"2026-11-10","start":"2026-11-10T09:00:00-08:00","end":"2026-11-10T10:00:00-08:00","speakers":["cj-avilla"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1376183","title":"New Ways of Working with Codex","abstract":"Keeping up with the rapid changes in coding agents can be exhausting. Join Dominik Kundel for a practical tour of recent features and workflows to bring you up to speed, without all the noise. We'll cover with live demos and walkthroughs how you can make the most out of your ChatGPT subscription whether you are pair programming with Codex or having your dot manage your incidents.","format":"workshop","room":"continental-6-workshop-room-3","note":null,"day":"2026-11-10","start":"2026-11-10T09:00:00-08:00","end":"2026-11-10T10:00:00-08:00","speakers":["charlie-guo","dominik-kundel"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1334020","title":"Build a Coding Agent Harness From an Empty Loop","abstract":"Start with an agent that lies about finishing, and leave with a harness you'd trust with your repo. A bare agent loop ends when the model says it's done. In my AI Engineer Europe 2026 talk, that loop hit a login page and reported success anyway. The model wasn't the problem: nothing around it checked anything. In this workshop we fix that by hand, one layer at a time, in TypeScript. We build every part of an agent harness from scratch: - **The agent loop:** call the model, run the tools it asks for, feed the results back. - **Guardrails:** iteration and context limits the model can't talk its way past. - **Context management:** what stays in the window when a run gets long. - **Deterministic verification:** read the trace, run the linter and the tests, and let a failed check overrule the model's claim. - **Retries and secrets:** a loop around the loop, and credentials the model never sees. One rule for the whole session: the prompt never changes. Every fix is code. You'll leave with a working harness on your laptop and the habit of fixing the harness before the prompt. Starting repo: https://github.com/TejasQ/basically-ai-harness","format":"workshop","room":"continental-79-workshop-room-4","note":null,"day":"2026-11-10","start":"2026-11-10T09:00:00-08:00","end":"2026-11-10T10:00:00-08:00","speakers":["tejas-kumar"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1333169","title":"One team's path to trusting AI generated code","abstract":"Our team merges 4x more pull requests than we did a year ago. Almost all of that code is AI-generated, human assisted. We tried scaling code review to match — more reviewers, AI review tools, stricter checklists — and none of it worked. What worked was stopping the fight over diffs entirely and building a verification layer around *intent*. This is the story of how one engineering team replaced the PR review bottleneck with an intent-driven verification workflow: capturing what a change *should* do before a single line is generated, encoding team standards as reusable invariants, and letting deterministic checks — not tired reviewers — produce the evidence that a change is safe to ship. I'll walk through the specific practices that made the difference — especially how we turned years of recurring review comments into machine-enforceable invariants — and share the results, the failures, and what we'd do differently.","format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-10","start":"2026-11-10T09:30:00-08:00","end":"2026-11-10T09:55:00-08:00","speakers":["ankit-jain"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1379134","title":"The True Cost of AI Coding","abstract":"After seeing the mental health effects of AI coding throughout the industry, Scott surveyed nearly 4000 developers about how agentic workflows are affecting their mental health. Hear what's happening and why.","format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-10","start":"2026-11-10T10:10:00-08:00","end":"2026-11-10T10:35:00-08:00","speakers":["scott-tolinski"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1356771","title":"Forget AGI. You're Surrounded by Low-Hanging Fruit.","abstract":"Software development lifecycles are full of slow processes you can automate. Let's fix those before we go pretend to be AI astronauts. We'll cover a range of easy-to-adopt techniques for that kind of automation, and for pushing back against the agent-supercharged entropy that keeps trying to make your codebase slop out of control. You'll leave with prompts, skills and workflows you can put to work the same afternoon.","format":"workshop","room":"continental-4-workshop-room-2","note":null,"day":"2026-11-10","start":"2026-11-10T10:10:00-08:00","end":"2026-11-10T11:10:00-08:00","speakers":["lucas-meijer"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373449","title":"Build a Multi-Agent PR Review and Repair Workflow with Omnigent","abstract":"Build a GitHub CI workflow that uses specialist agents to review pull requests, coordinate bounded repairs, and validate the resulting changes. In this hands-on workshop, you’ll connect agents across models and coding harnesses, define their roles and permissions, and test the pipeline while Omnigent handles session lifecycles, delegation, and messaging. We’ll draw on how Omnigent uses its own agents to manage incoming issues and contributions as an active open-source project, examining what it takes to turn review findings into tested changes ready for human approval. You’ll leave with version-controlled agent configurations and a runnable workflow you can adapt to your own projects.","format":"workshop","room":"continental-6-workshop-room-3","note":null,"day":"2026-11-10","start":"2026-11-10T10:10:00-08:00","end":"2026-11-10T11:10:00-08:00","speakers":["bradford-chang","elise-gonzales"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373450","title":"Stop Prompting, Start Delegating: Hand off work to a team of agents","abstract":"Most teams still use agents one task at a time: prompt, wait, review, repeat. In this hands-on workshop, you'll go further and hand an entire stream of work to agents with Factory. Bring your laptop. We'll take a real project from goal to merged PRs, setting up the scope, guardrails, and review checkpoints that make delegation safe. You'll leave with a workstream running and a playbook for deciding what to hand off next.","format":"workshop","room":"continental-79-workshop-room-4","note":null,"day":"2026-11-10","start":"2026-11-10T10:10:00-08:00","end":"2026-11-10T11:10:00-08:00","speakers":["ross-cefalu"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1357063","title":"One Rule, One Throwaway Skill: Agent Migrations with ast-grep","abstract":"Coding agents struggle with large migrations. A migration produces thousands of diffs, agents apply the same fix five different ways, and nobody can reliably say how much work remains. I migrated a production codebase to Effect by pairing each change with an ast-grep rule that matches the old pattern and a temporary skill that tells an agent how to fix a match. The list of matches told agents what to work on and told me how much was left. It also divided the work across parallel agents without overlap. But agents could also make a match disappear without fixing it, so I had to write rules that were hard to evade. I’ll show how the rule and skill pair worked on a real migration and what I would change next time.","format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-10","start":"2026-11-10T10:40:00-08:00","end":"2026-11-10T11:05:00-08:00","speakers":["justin-poehnelt"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"a8ad909b-f03d-416b-99e7-591813ebb8e5","title":"Networking Break","abstract":null,"format":"break","room":"continental-foyer","note":null,"day":"2026-11-10","start":"2026-11-10T11:10:00-08:00","end":"2026-11-10T11:40:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1334659","title":"Inference Engineering for Coding Agents","abstract":"Coding agents are a dominant use case for LLMs, but they tend to use generalized inference setups even at large scale. Like any optimization problem, in inference you can get better results with better constraints. This talk shares specific techniques that you can apply when building an inference service for exclusive use in coding agents, including targeted quantization and pruning schemes, domain-specific post-training, KV cache management around compaction events, subagent session affinity in a world of autoscaling and load balancing, and code-specific speculative decoding techniques across both common model-based approaches (DFlash, DSpark, EAGLE) and deterministic speculation using n-grams.","format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-10","start":"2026-11-10T11:40:00-08:00","end":"2026-11-10T12:05:00-08:00","speakers":["philip-kiely"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373451","title":"Build Your Own Agent Harness with eve and Vercel","abstract":"What does it take to build an agent that works across users, tools, and shared environments? In this hands-on workshop, we’ll introduce eve, Vercel’s agent framework, and explore the fundamentals of building your own agent harness. We’ll walk through the architecture behind multiplayer agents and how Vercel’s infrastructure fits together: Workflows for durable execution, Sandbox for isolated code execution, and AI Gateway for model access. Then we’ll put these concepts into practice through a guided exercise you can adapt to your own use case. You’ll leave with a practical understanding of the pieces behind an agent harness and a starting point for building and running your own agents on Vercel. Bring your laptop for the hands-on portion.","format":"workshop","room":"continental-4-workshop-room-2","note":null,"day":"2026-11-10","start":"2026-11-10T11:40:00-08:00","end":"2026-11-10T12:40:00-08:00","speakers":["owen-kephart"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1381709","title":"What Runs Where: The State of Local AI","abstract":"A look at where local AI stands today and where it might be headed. Drawing on experiences with models, hardware, and the people building with them, this session explores what’s changing, what’s becoming possible, and how local AI fits into the broader AI landscape.","format":"workshop","room":"continental-6-workshop-room-3","note":null,"day":"2026-11-10","start":"2026-11-10T11:40:00-08:00","end":"2026-11-10T12:40:00-08:00","speakers":["ahmad-osman"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373453","title":"Closing the Agentic Loop: Getting Agents to Safely Build, Verify, and Ship","abstract":"Agents can write code. That's not the hard part anymore. The hard part is trusting what they ship. In this hands-on workshop, I'll show you the loop I run every day: agents safely build, verify, and deploy the outcomes I want, and that loop is hooked up to signal (my own ideas, user feedback, bug reports, and friction) so it keeps itself going. I haven't read 1% of the code in my product, and agents author and merge most of the PRs. That only works because of the system around them. We'll start by running autopilot (npx kcd-skills@latest autopilot) on a real repo, yours if you want, and use the questions it asks to lay the foundation: invariants, decision records that say when it's OK to change them, a primitives catalog, and an AGENTS.md that's a router, not a novel. Then we'll get into verification. That means separate reviewer agents, PR templates that have you review systems instead of code, cloud agents with their own computers that show their work, and a control CLI your agents maintain for themselves. Finally, we'll limit the blast radius with feature flags, health checks, and backups you've actually restored, and wire up the loops that keep it all moving. Bring a laptop and a repo you own. What you'll walk away with: - An autopilot plan for your own repo, with each step your agents can take on next - A primitives catalog and invariants your agents actually follow - A PR template built around intent, one-way vs. two-way doors, and system diagrams, so you review systems instead of code - A verification setup: an AI reviewer, agents that test the running app, and a control CLI they maintain - A blast-radius checklist: flags with an owner, a metric, and a removal condition, health checks after deploy, and tested restores - The loops that keep it going: bug reports, user feedback, friction, and nightly cleanup Prerequisites: nothing to install ahead of time, but a good internet connection matters. To follow along on your own code, bring a laptop with a coding agent you already use (Cursor, Claude Code, Codex, etc.) signed in, plus a GitHub repo you own and can open pull requests on.","format":"workshop","room":"continental-79-workshop-room-4","note":null,"day":"2026-11-10","start":"2026-11-10T11:40:00-08:00","end":"2026-11-10T12:40:00-08:00","speakers":["kent-c-dodds"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1381496","title":"Proactive Agent Engineering","abstract":"We’ve seen a shift in the architecture of bleeding edge agents, motivated by the design of popular personal agents like Muse and Instinct. The latest agents run in the background and make progress on much larger goals. These proactive agents use primitives like schedules and event triggers, async subagents, browser use, and integrations with Slack and other messaging channels. Perhaps most importantly, they all have robust memory systems, which I’ll argue are the key to hitting the Goldilocks standard for proactivity.","format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-10","start":"2026-11-10T12:10:00-08:00","end":"2026-11-10T12:35:00-08:00","speakers":["sydney-runkle"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"29c87f1a-5570-4b60-9165-36e259a6aa07","title":"Lunch","abstract":null,"format":"break","room":"continental-5-breakfast-lunch","note":null,"day":"2026-11-10","start":"2026-11-10T12:40:00-08:00","end":"2026-11-10T13:50:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1341863","title":"What It Takes to Run a Company on Agent Swarms","abstract":"How harness evolved from code to Knowledge work","format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-10","start":"2026-11-10T13:50:00-08:00","end":"2026-11-10T14:15:00-08:00","speakers":["karan-vaidya"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373447","title":"AFK Engineering: From Terminal to Voice-Controlled Remote Agents (Part 1)","abstract":"You will move from local coding in Google Antigravity to building a sandboxed remote agent on Gemini Managed Agents with reusable skills, vaulted credentials, and remote MCP. From there, you will connect the Gemini Live API to trigger remote tasks and steer your agents by voice.","format":"workshop","room":"continental-4-workshop-room-2","note":null,"day":"2026-11-10","start":"2026-11-10T13:50:00-08:00","end":"2026-11-10T14:50:00-08:00","speakers":["ivan-leo","philipp-schmid","thor-schaeff"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1376182","title":"A Field Guide to Agent Shapes: From Long-Horizon to Open-Ended","abstract":"Agents in 2026 split into a bunch of distinct shapes like externalized context with RLMs, agents messaging each other, harnesses the agent rewrites itself, sandboxes, orchestrators with sub-agents, and brute-force recombination. This talk goes through what each one helps with, then looks at three real deployments in industries/domains generally lagging in AI adoption that reused some of these patterns. We finish on where this is heading in 2027 with models that edit their own context, tweak other networks, get trained for exploration earlier, and learn continuously from tasks they generate themselves.","format":"workshop","room":"continental-6-workshop-room-3","note":null,"day":"2026-11-10","start":"2026-11-10T13:50:00-08:00","end":"2026-11-10T14:50:00-08:00","speakers":["yacine-mahdid"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1357839","title":"Keep the Harness, Own Your Inference","abstract":"Claude Code without Claude. Codex without an OpenAI model. We’ll put both harnesses to work on a real codebase with open-weight models running on a DGX Spark. They’ll inspect the repository, change code, and test their work. The terminal experience stays familiar. The entire stack runs on hardware you control. Drawing on our work building vLLM Agentic API, we’ll show how we’re bringing familiar coding harnesses to inference engines and distributed serving stacks including vLLM, SGLang, NVIDIA Dynamo, and llm-d. The goal is to make the harness, model, and serving infrastructure independent choices. With Codex Cloud, the coding harness itself runs remotely. Behind that harness, the Responses API adds another layer of agentic execution: the server can manage conversations, execute tools, and retrieve context. We’ll open up that machinery and explore how responsibility gets divided between the harness and the agentic server. Drawing on our work building vLLM Agentic API, we’ll dig into conversation state, memory through retrieval and file search, and compaction: what the agent remembers, how it finds what it needs, and what survives when its context fills up. As more of the agent runs on servers, owning your inference means understanding—and controlling—this execution stack. You’ll leave with the setup and verification steps to run your own coding agent backend—from a DGX Spark on your desk to a shared GPU cluster. Choose the model, choose the engine, and scale the infrastructure while keeping the coding tools you already use. Key takeaways - Run it locally: connect Codex and Claude Code to open-weight inference on an NVIDIA DGX Spark. - Take it to a cluster: connect the same agent-facing API layer to distributed serving with llm-d or NVIDIA Dynamo. - Make the whole session work: preserve conversation history, tool handoffs, and streaming across backends, then verify the result through a completed coding task.","format":"workshop","room":"continental-79-workshop-room-4","note":null,"day":"2026-11-10","start":"2026-11-10T13:50:00-08:00","end":"2026-11-10T14:50:00-08:00","speakers":["francisco-javier-arceo"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1356697","title":"The new job of the data team is providing context to AI","abstract":"Business intelligence is dead; long live context! The new job of every data team is to provide context to AI, so that when your head of sales asks “give me your 3 best ideas for improving pipeline conversion”, it gives 3 great answers grounded in accurate, correct queries. The tools for providing this solution are the same tools you know and love: AI is just a new consumer of the data stack. Fivetran + dbt labs CEO George Fraser will take you through how real users solve this problem today, and demo live how to connect AI to real data.","format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-10","start":"2026-11-10T14:20:00-08:00","end":"2026-11-10T14:45:00-08:00","speakers":["george-fraser"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1352199","title":"Building a Shared AI Assistant: The Platform Challenges Beyond MCP","abstract":"Two years ago, teams asked our platform team to connect their data to an AI assistant. Today they ship their own MCP servers in a week. That speed is a win, and it swaps one engineering problem for a harder one: how do you decide what gets through, what gets gated, and who owns the gates? This talk gives you a way to answer that — what stays team-owned, what becomes shared platform, and how to tell whether consolidating actually helped. At Netflix, bringing these tools together creates real value. Functions like Finance and Talent can now connect information that previously lived in separate systems. A business user can ask a question in one place instead of taking it to three teams. But that same reach creates ambiguity. Multiple tools expose different versions of the same entity, or claim to answer the same question. As the catalog grows, the assistant has more ways to choose incorrectly. Sometimes a data-owning team discovers that another team has built on its data only when an evaluation fails. How do you build a shared AI assistant that brings tools and data from across a company into one place? At Netflix, product teams increasingly build their own MCP integrations. Our challenge is making those capabilities work together so employees can get answers across teams through a single assistant. This talk covers the decisions and mechanisms behind that shift: connector certification, an internal benchmark built from real employee queries that we use to evaluate routing between overlapping tools, and how we classify actions to separate what an agent can do on its own from what needs a person first. We'll examine where our initial domain boundaries broke down, what required agreement between teams, and why better tool descriptions alone couldn't resolve the conflicts. We'll close on what we haven't solved: who owns the authoritative version of an entity, how to retire a connector other teams depend on, and when the benefits of a shared capability justify the coordination it requires.","format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-10","start":"2026-11-10T15:00:00-08:00","end":"2026-11-10T15:25:00-08:00","speakers":["utkarsh-shrivastava"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373612","title":"AFK Engineering: From Terminal to Voice-Controlled Remote Agents (Part 2)","abstract":"You will move from local coding in Google Antigravity to building a sandboxed remote agent on Gemini Managed Agents with reusable skills, vaulted credentials, and remote MCP. From there, you will connect the Gemini Live API to trigger remote tasks and steer your agents by voice.","format":"workshop","room":"continental-4-workshop-room-2","note":null,"day":"2026-11-10","start":"2026-11-10T15:00:00-08:00","end":"2026-11-10T16:00:00-08:00","speakers":["ivan-leo","philipp-schmid","thor-schaeff"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1357867","title":"Hands-on Gitar: An AI Code Verification Agent for Your CI","abstract":"Gitar is Sonar’s AI code verification agent, complementing SonarQube with an understanding of each change’s context and intent. In this hands-on workshop, you’ll install Gitar as a GitHub App and use it across three pull request scenarios that show how verification goes beyond code review. Gitar verifies every change against your project's context and rules, catches problems, generates working fixes, and iterates until your CI pipeline passes. You'll leave knowing how to set up Gitar on your own repositories. You'll also see how it delivers ready-to-merge, green PRs with high signal and low noise, while your team keeps control.","format":"workshop","room":"continental-6-workshop-room-3","note":null,"day":"2026-11-10","start":"2026-11-10T15:00:00-08:00","end":"2026-11-10T16:00:00-08:00","speakers":["taylor-luttrell-williams"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373454","title":"Build a personal agent with Exa Search","abstract":"A personal agent gets asked everyday questions: where to eat near the office that's open late, whether it will rain on Saturday, how the Warriors did last night, what a stock did this week. Exa answers all of these through one search call. Places come back with addresses, hours and reviews; weather comes back as daily forecasts; sports come back as scores, standings and schedules. You don't need a separate API for each. In this session, Jakub Hojsan, forward deployed engineer at Exa you show you how to build a personal agent on Exa search that handles a day's worth of real requests, from finding dinner to planning around the weather. We will provide a repo to work out of as part of this workshop.","format":"workshop","room":"continental-79-workshop-room-4","note":null,"day":"2026-11-10","start":"2026-11-10T15:00:00-08:00","end":"2026-11-10T16:00:00-08:00","speakers":["jakub-hojsan"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1334565","title":"Building World-class Agentic GTM: Learnings from Monaco for Monaco","abstract":"Building a custom agents platform is one of the key pieces to unlocking AI for complex verticalized business workflows. Monte Carlo is the sales-specific system we've built to help scale Monaco's revenue: a platform where revenue teams encode their own playbooks as agents that run against everything we've ingested about their business, including pipeline, outbound, calls, and the CRM. Sales is a particularly complex vertical for the following reasons: no two revenue orgs look alike, the data is large and heterogeneous, and the expertise that matters lives in per-rep workflows nobody has written down. Over the last 2 years, we’ve built a custom harness and orchestration system to power our world-class GTM team. In this talk, I'll break down the components a verticalized agent platform needs in order to be fast and correct, including an execution plane, memory and curated implicit and explicit context, how expertise gets represented, and the evaluation loop, along with what is still unresolved.","format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-10","start":"2026-11-10T15:30:00-08:00","end":"2026-11-10T15:55:00-08:00","speakers":["mihail-eric"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"3e1a3db8-9da0-4015-af37-7277b48182cb","title":"Networking Break","abstract":null,"format":"break","room":"continental-foyer","note":null,"day":"2026-11-10","start":"2026-11-10T16:00:00-08:00","end":"2026-11-10T16:30:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1351616","title":"Multiplayer software factories - Leading the shift to concurrent delivery","abstract":"Your whole team runs coding agents now, and they all land on one main. Continuous delivery wasn't built for that. This talk maps what breaks when a software factory goes multiplayer, and the patterns that fix it: one main for the agents, one board for the people.","format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-10","start":"2026-11-10T16:30:00-08:00","end":"2026-11-10T16:55:00-08:00","speakers":["patrick-debois"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1304940","title":"Our Agents Shipped 6,000 PRs to 600+ Companies in The First Month. Now They Build Features","abstract":"PostHog Self-driving wrote 6,000+ pull requests in its first month that 600+ companies chose to merge. We showed the signal-to-PR pipeline at AI Engineer in London this April, and released it in late June. I'll show what happened since: where agents overreached, what we threw away, what's still science fiction, and the jump from fixing bugs to building features. The system now pitches features backed by your product data, builds them, and reviews them paranoidly, testing like a real customer. All open source. Real PRs, real reviews, real failures, shown live.","format":"workshop","room":"continental-4-workshop-room-2","note":null,"day":"2026-11-10","start":"2026-11-10T16:30:00-08:00","end":"2026-11-10T17:30:00-08:00","speakers":["alex-lebedev"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1383277","title":"Do it All with Devin","abstract":"What is the future of post training in coding. What a modern research team looks like, and how Devin is part of it.","format":"workshop","room":"continental-6-workshop-room-3","note":null,"day":"2026-11-10","start":"2026-11-10T16:30:00-08:00","end":"2026-11-10T17:30:00-08:00","speakers":["charlie-meyer","giovanni-d-antonio"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1375631","title":"Build your first Kiro Crew app: An agent that triages your backlog while you sleep","abstract":"Most people meet AI agents as a chat bot. In this hands-on workshop you will build one that works while you are not watching. Starting from an empty directory, you will install Kiro Crew, an open-source orchestration layer for coding agents, and ship a working app: an agent that reads your repository’s open issues, finds the duplicates, explains why it thinks so, and posts its findings on a schedule. Along the way you will give the agent persistent memory so it stops re-reading what it already knows, fan the work out across background subagents so a thousand issues do not take a thousand turns, and set the boundary that decides what it may and may not touch. Bring a laptop and a GitHub repository you care about. You will leave with the app running, and with a clear picture of what separates a demo from something you would actually let run unattended.","format":"workshop","room":"continental-79-workshop-room-4","note":null,"day":"2026-11-10","start":"2026-11-10T16:30:00-08:00","end":"2026-11-10T17:30:00-08:00","speakers":["arundeep-nagaraj","dan-kiuna"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1304968","title":"Warning: This Pull Request Contains Graphic Content","abstract":"AI coding agents can turn a small feature request into a substantial code change and a pull request description that reads like a short novel. Yet the decisions, failed experiments, and human interventions that shaped the result remain buried in agent sessions. Reviewers reconstruct the history, question unsupported claims, and send the PR back for another costly round. Compressing the context into fewer tokens still leaves them searching for the missing connections. TraceToon uses that history to create better PR descriptions and comics grounded in the work behind the diff. With Relate, an embedded, in-memory graph database, TraceToon connects prompts and decisions to code changes and verification runs. It retrieves the evidence neighborhood around each change and turns it into a focused brief for drafting and review. The comic makes the wrong turns and corrections visible, while the technical description explains the behavior, rationale, and checks that support the result. Following a real pull request from Claude Code, Codex, or Antigravity sessions to a finished PR and comic, we’ll show how the graph keeps the story honest: connecting sessions to branch changes, distinguishing an earlier passing test from validation of the submitted code, and preserving uncertainty when evidence is incomplete. We’ll also show how connected evidence, a tuned brief, and cost-effective reviewers work together to improve PR quality and lower total drafting cost in our benchmarks. Attendees will leave with an open source workflow and practical patterns for using graph context and visual storytelling to make agent work easier to understand and review.","format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-10","start":"2026-11-10T17:00:00-08:00","end":"2026-11-10T17:25:00-08:00","speakers":["cassandra-chin","stephen-chin"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1380081","title":"MC Outro","abstract":null,"format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-10","start":"2026-11-10T17:25:00-08:00","end":"2026-11-10T17:30:00-08:00","speakers":["richelle-ji"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"804ef31d-65f3-4d4f-8b16-25698ce1b28a","title":"Opening Reception","abstract":null,"format":"social","room":"golden-gate-expo-hall-lunch-reception","note":null,"day":"2026-11-10","start":"2026-11-10T17:30:00-08:00","end":"2026-11-10T20:30:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"e8b1a15a-4a96-4ef0-92d7-99ac83615e72","title":"Token Billionaires Lounge","abstract":null,"format":null,"room":"continental-7-token-billionaires-lounge","note":null,"day":"2026-11-11","start":"2026-11-11T08:00:00-08:00","end":"2026-11-11T17:40:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"f8b0a0a6-9f29-4434-92fe-694d66d20a34","title":"Registration","abstract":null,"format":"registration","room":"registration-outside-golden-gate","note":null,"day":"2026-11-11","start":"2026-11-11T08:00:00-08:00","end":"2026-11-11T17:40:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1376240","title":"MC Intro","abstract":null,"format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T09:00:00-08:00","end":"2026-11-11T09:10:00-08:00","speakers":["corey-quinn"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1352467","title":"What Will You Build When AI Is 10x Faster?","abstract":"Many AI product decisions are influenced by how long someone will wait for an answer. Do you give an agent another pass to check its answer, or make it respond faster? Can your voice assistant finish reasoning before the pause gets awkward? Faster inference gives developers the option to build smarter, more responsive user experiences. We’ll look at what faster inference lets you build, from more responsive voice applications to agents that can try, test, and update within a few seconds. We’ll discuss when speed is worth paying for, when other parts of your application become the bottleneck, and how to use higher responsiveness. Along the way, we’ll share how Gimlet combines GPUs and specialized accelerators to make inference faster, and what that means for the developers using that speed.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T09:10:00-08:00","end":"2026-11-11T09:30:00-08:00","speakers":["natalie-serrino"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373455","title":"Rethinking Claude Code Best Practices","abstract":"The models have gotten really good, and most of what we've added to our Claude Code setups over the past year is now holding them back. In this talk I'll go through what Claude Code best practices look like for the Claude 5.5 models, what's still worth keeping, and what you no longer need to think about.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T09:30:00-08:00","end":"2026-11-11T09:50:00-08:00","speakers":["lydia-hallie"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373457","title":"cloudflare is a neolab","abstract":"we trained some new system one models (clef, clairic). they fit perfectly within our decade-old primitives like workers, our edge latency hypothesis for workers ai, and our ambition to be the agent cloud.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T09:50:00-08:00","end":"2026-11-11T10:10:00-08:00","speakers":["michelle-chen"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373446","title":"All Code Is Slop (Except Mine)","abstract":"The Grok Bot team at SpaceXAI lands hundreds of PRs a day. Nobody reads them all, yet quality goes up anyway. In this talk, we'll find out how the Grok Bot team turns slop into gold at an incredible pace.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T10:10:00-08:00","end":"2026-11-11T10:30:00-08:00","speakers":["lauren-tan"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1376244","title":"MC Outro","abstract":null,"format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T10:30:00-08:00","end":"2026-11-11T10:40:00-08:00","speakers":["corey-quinn"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"a2b441c8-9b8e-489b-8da3-e6878f79cb02","title":"Networking Break","abstract":null,"format":"break","room":"golden-gate-expo-hall-lunch-reception","note":null,"day":"2026-11-11","start":"2026-11-11T10:40:00-08:00","end":"2026-11-11T11:20:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"d4b20610-7cef-463f-b607-b5a51a334993","title":"Expo Hall Hours","abstract":null,"format":null,"room":"golden-gate-expo-hall-lunch-reception","note":null,"day":"2026-11-11","start":"2026-11-11T10:40:00-08:00","end":"2026-11-11T16:00:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1380068","title":"Manage Yourself Out of the Loop","abstract":"More coding agents mostly means more tabs to watch. In the past year, one of our engineers went from about 20 merged pull requests a month to nearly 7,000. I'll show what we changed in our repos so an agent can take one small feature from prompt to merge on its own.","format":"talk","room":"continental-13-expo-sessions","note":null,"day":"2026-11-11","start":"2026-11-11T10:55:00-08:00","end":"2026-11-11T11:15:00-08:00","speakers":["erik-thorelli"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373458","title":"Refactor or Rot: Building a self-improving codebase","abstract":"Your coding agents run in loops: plan, implement, test, repeat. This inner loop focuses on completing a task, and it tends to get all the attention. But there’s an outer loop, too. Each agent builds on the codebase the last one left behind, inheriting its patterns, abstractions, and shortcuts. Those patterns can make the codebase easier to understand, maintain, and extend, or compound complexity and make future changes riskier. In this talk, I’ll show you how to build an outer loop that reinforces code quality and counteracts decay. Drawing on classic software design and refactoring techniques, we’ll equip an agent with skills to identify code smells, reason about coupling and module boundaries, and recommend refactors that make future changes easier. We’ll wire that analysis into the development lifecycle, running on PRs and across the codebase, weighing each recommendation’s benefit against its cost and risk. You’ll learn when to refactor, when to leave working code alone, and how to make refactoring part of your development workflow, so your coding agents leave behind codebases that are better, not just bigger.","format":"talk","room":"continental-13-expo-sessions","note":null,"day":"2026-11-11","start":"2026-11-11T11:20:00-08:00","end":"2026-11-11T11:40:00-08:00","speakers":["jacob-prall"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1323755","title":"I deleted 90% of my harness (And It Got Better)","abstract":"Alt Title: Why Models Are Superhuman with Bash (Where Humans Fail) --- I spent my day to day building a agents with custom tools for everything. Every few month I decide to delete everything and see what is not needed anymore. I stripped out every dedicated tool until only Bash remained. I cut the prompt to 300 tokens and made the execution loop asynchronous. Benchmark scores jumped. Experience went up. Rich Sutton called this the Bitter Lesson: building human heuristics into AI always loses to general methods backed by compute. Models are now superhuman with the bash. A frontier model can synthesize an ad-hoc 15-line pipeline combining Python AST parsing, ripgrep, git diffs, and subshells in 200ms to make progress on a users task, there is no need for dedicated edits, search or grep tools anymore. Learn how to delete your code.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T11:20:00-08:00","end":"2026-11-11T11:40:00-08:00","speakers":["philipp-schmid"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373460","title":"Heal Your Agents, Don't Just Grade Them","abstract":"Your evals are green, and users are still hitting failures. The evals aren't wrong. They test what you anticipated, and production at millions of sessions a day keeps inventing failures nobody wrote a test for, many visible only as a pattern across sessions. Detecting those failures continuously is a hard problem in its own right. Every agent fails differently, the failures that matter are rare, and a detector that flags everything is as useless as one that flags nothing. We've been working on this with customers running agents at scale and by running it on our own agents, learning which failures are worth surfacing and which are just noise. Along the way, three engineering problems kept coming up: Economics: you can't afford to run a reasoning model over every session, so what do you screen with, and what earns a closer look? Noise: a thousand flagged sessions are usually a handful of root causes. How do you collapse them and decide which to fix first? Trust: when a coding agent proposes the fix as a pull request, what has to be true before you merge it? How do you verify each fix and expand to cover every failure you find so it stays caught? You'll leave with the tradeoffs that matter when you move from grading agents to healing them, drawn from teams doing it today","format":"talk","room":"continental-13-expo-sessions","note":null,"day":"2026-11-11","start":"2026-11-11T11:45:00-08:00","end":"2026-11-11T12:05:00-08:00","speakers":["khasimul-asif-mohammad","sudhir-tonse"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373459","title":"The Rise of the Agent Workforce: Rethinking Agent Infrastructure","abstract":"The next generation of agents won't just answer questions. They'll work autonomously, collaborate with other agents, and learn from experience. As we move from interactive chatbots to persistent agent workforces, the infrastructure powering them needs to fundamentally evolve. In this talk, we'll explore the emerging architecture of agentic systems, from stateful sandboxes and persistent memory to agent communication and orchestration. We'll examine why today's agent platforms aren't built for this future, and what it will take to power a world where teams of agents can tackle complex, long-running work together.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T11:45:00-08:00","end":"2026-11-11T12:05:00-08:00","speakers":["ankit-mathur"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373462","title":"How to build agents over your own data","abstract":"The biggest bottleneck to building powerful internal agents is giving them the right organizational context. When agents can reliably find that context, they can answer questions, review code, investigate incidents, and automate workflows across the company. But company knowledge is scattered across Slack, email, Google Drive, code repositories, Linear, internal documentation, and multiple versions of the same information. Putting everything into the model’s context is expensive, risky, and often reduces answer quality. Connecting every source through separate MCP servers creates another bottleneck: the agent must make numerous tool calls while inheriting each service’s latency, rate limits, and uneven search quality. This talk shows how to separate retrieval from reasoning by giving internal agents a unified search layer for company knowledge. We’ll explore how a search subagent breaks down complex tasks, combines semantic and exact retrieval across systems, preserves source permissions, verifies freshness and versions, and returns compact, cited evidence to the acting agent. Through realistic internal workflows, we’ll demonstrate how better retrieval makes agents more accurate, traceable, and useful while reducing tool calls, latency, and cost.","format":"talk","room":"continental-13-expo-sessions","note":null,"day":"2026-11-11","start":"2026-11-11T12:10:00-08:00","end":"2026-11-11T12:30:00-08:00","speakers":["aamir-shakir"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373461","title":"Building a Safe Software Factory","abstract":"Coding agents have made code cheap to write, and teams are shipping 10× more changes than they did two years ago. Human review was built for human speed, so the industry is moving from reviewed PRs to automated software factories. At Gitar and Sonar, we are learning how to build a safe software factory, with layers of verification across the system. We'll share what we've been learned so far, and where we think this trend is headed.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T12:10:00-08:00","end":"2026-11-11T12:30:00-08:00","speakers":["andrew-finch"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373464","title":"The Software Factory That Needs Zero FDEs","abstract":"Working alone with Claude feels like a superpower. You open a session, give it the right context, and watch it ship. Scaling that to a whole engineering org is where it breaks. One agent with more context, more tools and more responsibility starts drifting, costs climb, and nobody can tell which part failed. So most \"AI software factories\" quietly ship with a team of forward-deployed engineers who wire up every customer by hand. We built Overcut so a factory doesn't need them. Instead of one big agent, it uses small agents with clear jobs: triage, root-cause analysis, implementation, code review and verification. Each one has its own context, model and memory, so it can be measured and improved on its own. Orchestration connects them. Workflows react to events in GitHub, Jira and Slack, run in parallel, and stop at human approval gates where it matters. Because every piece is a reusable building block, teams assemble their factory from ready-made parts instead of waiting for someone to build it for them. Then we'll prove it live. Starting from an empty project, we'll build the factory on stage: a production alert in Slack becomes a Jira ticket with a root-cause analysis, the ticket becomes a pull request, and the PR is reviewed and fixed until it's ready to merge. No FDEs, no hand-wiring. You'll leave with architecture patterns you can apply tomorrow , whether you're one developer or rolling out agents across a whole company.","format":"talk","room":"continental-13-expo-sessions","note":null,"day":"2026-11-11","start":"2026-11-11T12:35:00-08:00","end":"2026-11-11T12:55:00-08:00","speakers":["raz-berman-gold"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373463","title":"Earning Autonomy: From Missions to Workstreams","abstract":"Seven months ago, Factory introduced Missions, an orchestrator that ran worker agents through a full project with validation at every milestone. Real customer projects showed its limits. It only handled code, it was built for older models, and its context belonged to one person instead of the team. Luke Alvoeiro explains how Factory rebuilt it. A more token-efficient Droid made running many agents affordable. Environments let agents scale out inside a customer's own VPC. The new Missions gives each project a long-lived home with one orchestrator, shared context, and more autonomy as validation earns trust. When a project moves into maintenance, its mission graduates into a workstream: agents that turn bug reports, alerts, and ideas into validated, shipped software.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T12:35:00-08:00","end":"2026-11-11T12:55:00-08:00","speakers":["luke-alvoeiro"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"d3d5809a-6087-496f-8f90-9bb417a58d02","title":"Lunch","abstract":null,"format":"break","room":"golden-gate-expo-hall-lunch-reception","note":null,"day":"2026-11-11","start":"2026-11-11T12:55:00-08:00","end":"2026-11-11T14:05:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373466","title":"Coding Agents and How to Tame Them","abstract":"Coding agents are remarkably capable one minute and burning 50,000 tokens in a broken loop the next. Over the past few months at Google DeepMind, I've worked with Kaggle to audit over 50 coding benchmarks trace by trace and build a platform to evaluate frontier agents at scale. In this short 18-minute talk, we'll cover the weird failure modes we caught in the wild, the lessons we learned building air-gapped sandboxes, and how to take those same lessons to design better harnesses, verifiers, and coding environments for your own agents.","format":"talk","room":"continental-13-expo-sessions","note":null,"day":"2026-11-11","start":"2026-11-11T14:05:00-08:00","end":"2026-11-11T14:25:00-08:00","speakers":["ivan-leo"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373465","title":"I love you so jevving much","abstract":"Let's talk about the state of AI, how something like jev stayed under the radar for years, how we made it, and most importantly: what comes next! I've been told that this crowd is the absolute best of any conference for building the future, so let's jam about sci-fi and finally build some sick smart software.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T14:05:00-08:00","end":"2026-11-11T14:23:00-08:00","speakers":["diogo-almeida"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1357875","title":"More Checks, Less Noise: Layered Security for AI-Assisted Development","abstract":"More security checks should mean more confidence, not more alerts to ignore. As AI accelerates code production, how do we add independent verification without turning development into an obstacle course? This session explores two dimensions of application security: using complementary analysis methods and placing checks at useful points throughout the software development lifecycle. We’ll examine where deterministic analysis provides repeatable checks, where probabilistic, AI-powered review can add context-sensitive reasoning, and why simply stacking tools can create more noise than assurance. We’ll start with a vendor-neutral framework for choosing checks, prioritizing findings, and keeping review actionable. Then, a live demo will bring three complementary approaches together: static application security testing (SAST), software composition analysis (SCA), and AI-powered analysis of logic-level vulnerabilities. You’ll leave with a practical way to evaluate layered verification: what each check contributes, where it belongs, and how to turn its findings into manageable work rather than another queue of alerts.","format":"talk","room":"continental-13-expo-sessions","note":null,"day":"2026-11-11","start":"2026-11-11T14:30:00-08:00","end":"2026-11-11T14:50:00-08:00","speakers":["killian-carlsen-phelan","taylor-luttrell-williams"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1374818","title":"Beyond Generation: Fast, Structured AI Decisions with Jev at Glean","abstract":"Not every step in an AI product needs a full generative LLM call. Many are bounded decisions, like understanding what a user is asking for, picking the best suggestion to show, checking whether an answer's citations hold up, routing to the right tool or model, or deciding if a request needs a guardrail. In this session, I'll walk through how Glean has been exploring Jev across these decisions, what we learned about where fast, confidence-scored decisions shine, and how we evaluate these models before they reach users.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T14:30:00-08:00","end":"2026-11-11T14:43:00-08:00","speakers":["chinmay-goyal"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1374822","title":"Your Automation Is Overthinking It","abstract":"Enterprise automation gets hard to maintain when a single agent is responsible for understanding a request, finding evidence, and deciding what happens next. Drawing on two decades of experience automating business processes, we'll show how to break that work into steps a team can understand, test, and change. We'll explore when a focused judgment is enough, when a generative model should investigate, and when a person should step in. We'll share what we learned about accuracy, speed, and cost so you can make those choices in your own workflows.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T14:48:00-08:00","end":"2026-11-11T15:01:00-08:00","speakers":["chibi-vikram","kevin-bernstein"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373467","title":"Ground Truth or Dare: Using Oracles to Make Postgres Reactive","abstract":"Live SQL is the holy grail of realtime. Subscribe to any SQL query, with joins, aggregates and ordering, and the result stays live as your data changes. It’s easy to describe but very hard to build. At Electric, we spent years chasing it. Then we joined Neon and built it in weeks with coding agents, inside Postgres. Live queries are database infrastructure. This isn’t code you hand to an agent and hope for the best. So we used Postgres’s own query engine as an oracle. Once the agents had the ability to verify their own work, they could go super fast and burn down through the featue requirements. In this talk, I’ll cover what we built, how we built it and how oracles let us have both truth and dare: to get it right and ship fast with agents.","format":"talk","room":"continental-13-expo-sessions","note":null,"day":"2026-11-11","start":"2026-11-11T14:55:00-08:00","end":"2026-11-11T15:15:00-08:00","speakers":["james-arthur"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1376197","title":"Your Judge Is Hallucinating Too","abstract":"Every step an agent takes in ZoomInfo's Agent Teams is graded by another model. Then we ran Jev beside it and found the grader was passing work that never happened. This talk is about what we found, what we replaced, and why \"did the agent do a good job?\" is the wrong question to ask a model.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T15:06:00-08:00","end":"2026-11-11T15:19:00-08:00","speakers":["brian-kennedy"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373468","title":"CVE remediation with Factory: from finding to merged PR","abstract":null,"format":"talk","room":"continental-13-expo-sessions","note":null,"day":"2026-11-11","start":"2026-11-11T15:20:00-08:00","end":"2026-11-11T15:40:00-08:00","speakers":["nikhil-harithas"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1376198","title":"Autocomplete for Actions: System One from the UI to the DB","abstract":"Search guesses your next word. Workday's Sana guesses your next task. Millions of people use Workday to check their pay, book time off and find their team, and most of those requests are too simple to wait on a full LLM turn. I'll show how we use Jev as a System One model from the UI to the DB: picking the right action card while you type, and running inside DuckDB as a SQL filter.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T15:24:00-08:00","end":"2026-11-11T15:37:00-08:00","speakers":["scott-roberts"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1380927","title":"Leaving Localhost: Building an Agent-Native Dev Environment","abstract":"Why is it that Anthropic can port Bun from Zig to Rust in 11 days, while most teams still struggle to make sweeping changes to production software? Bun is complex, but it turns out its verification loop is actually quite clear: there's a well-defined TypeScript spec, and a huge battery of tests the agent can iterate against. This talk will explore techniques to build agent-native dev environments in the cloud that allow for these kinds of tight verification loops for software that's traditionally much harder to verify: tax accounting, vertical AI agents, robotics control systems, etc. We'll discuss how to manage stateful dependencies (databases, queues, caches), third-party services, and seed data so you can focus on architecture & product while your agents handle implementation & testing in the cloud.","format":"talk","room":"continental-13-expo-sessions","note":null,"day":"2026-11-11","start":"2026-11-11T15:45:00-08:00","end":"2026-11-11T16:05:00-08:00","speakers":["sajid-mehmood"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"222dd686-32de-4bf1-81fe-53ca33a74d1b","title":"Afternoon Break / Keynote Reset","abstract":null,"format":"break","room":"golden-gate-expo-hall-lunch-reception","note":null,"day":"2026-11-11","start":"2026-11-11T15:45:00-08:00","end":"2026-11-11T16:05:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1376245","title":"MC Intro","abstract":null,"format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T16:20:00-08:00","end":"2026-11-11T16:30:00-08:00","speakers":["corey-quinn"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373469","title":"What it takes to set intelligence free","abstract":"Models keep getting better and the systems we build around them need to keep up. This talk goes inside Lovable’s engineering: forkable computers that give agents room to experiment, persistent histories that let them continue longer work, and durable communication that lets them coordinate. We’ll explore what it takes to give agents more independence, and how these foundations could help them build, ship, learn from feedback, and keep improving a product.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T16:30:00-08:00","end":"2026-11-11T16:50:00-08:00","speakers":["fabian-hedin"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373470","title":"How to build an agent that builds the culture","abstract":"Ramp built its own coding agent, Inspect, which writes ~75% of merged PRs. At the start of 2026, the technology was the novel part, but today, it's commonplace. In this talk, Zach will talk about how Inspect has evolved this year, and re-shaped the culture of engineering at Ramp around agent-driven development.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T16:50:00-08:00","end":"2026-11-11T17:10:00-08:00","speakers":["zach-bruggeman"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373471","title":"Software Factories: Escape from Trash Mountain","abstract":null,"format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T17:10:00-08:00","end":"2026-11-11T17:30:00-08:00","speakers":["steve-yegge"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1376191","title":"2026 in LLMs","abstract":"2026 has been a wild year for LLMs. Simon will recap everything that's happened since last November's coding agent inflection point: January's OpenClaw craze, the rise and fall of tokenmaxxing, US export controls on frontier AI, open weights that can compete with the best, cyberattacks by rogue agents, Fable-class models, and the recent wave of 3D modeling and vibe-coded games. And the year's not over yet!","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T17:30:00-08:00","end":"2026-11-11T17:50:00-08:00","speakers":["simon-willison"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1376246","title":"MC Outro","abstract":null,"format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T17:50:00-08:00","end":"2026-11-11T18:00:00-08:00","speakers":["corey-quinn"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"allthings-aie@2026-11-11T19:00:00-08:00","title":"allthings/aie","abstract":"Free, approval-only community night after the talks: lightning hot takes, open mic, music, and performances. No sponsored talks, no pitches.","format":"social","room":null,"note":"Place not published: the official page gives none and the Luma address is guests-only","day":"2026-11-11","start":"2026-11-11T19:00:00-08:00","end":"2026-11-11T22:00:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026"},{"id":"2f9774d5-ce23-415d-8047-2ffd94f4ee61","title":"Token Billionaires Lounge","abstract":null,"format":null,"room":"continental-7-token-billionaires-lounge","note":null,"day":"2026-11-12","start":"2026-11-12T08:00:00-08:00","end":"2026-11-12T17:40:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"57c167d1-4feb-4c9d-aff2-94d59b9f831c","title":"Registration","abstract":null,"format":"registration","room":"registration-outside-golden-gate","note":null,"day":"2026-11-12","start":"2026-11-12T08:00:00-08:00","end":"2026-11-12T17:40:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1380094","title":"MC Intro","abstract":null,"format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-12","start":"2026-11-12T09:00:00-08:00","end":"2026-11-12T09:10:00-08:00","speakers":["corey-quinn"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1379009","title":"Ambition in AI","abstract":null,"format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-12","start":"2026-11-12T09:10:00-08:00","end":"2026-11-12T09:30:00-08:00","speakers":["jason-liu"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373472","title":"The Software Atelier","abstract":"On the way to the software factory, let's build an atelier first. Drawing on the last year of working with and on Pi, this talk argues for using our new tools to craft better software, not just more of it.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-12","start":"2026-11-12T09:30:00-08:00","end":"2026-11-12T09:50:00-08:00","speakers":["armin-ronacher"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373473","title":"Software Engineerin
