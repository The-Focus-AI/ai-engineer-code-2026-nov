<title>AI Engineer Code Summit 2026 Field Guide</title>

<style>
/* Layout: a programme you carry. "Right now" first, then the day by time slot, with the
   room and level beside every session, as on hotel event signage. Tokens from design.md. */
:root {
  --ink: #191714;
  --paper: #fbf8f1;
  --panel: #f2ecdf;
  --muted: #6d6458;
  --rule: #d6cbb8;
  --accent: #8a2f1d;
  --on-accent: #fbf8f1;
  --serif: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #f0e9db; --paper: #1b1815; --panel: #27231e; --muted: #a99e8d; --rule: #423b32;
    --accent: #e08a70; --on-accent: #1b1815; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #f0e9db; --paper: #1b1815; --panel: #27231e; --muted: #a99e8d; --rule: #423b32;
  --accent: #e08a70; --on-accent: #1b1815; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 8.5rem; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  background: var(--paper); color: var(--ink); font: 1.05rem/1.5 var(--serif);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 4rem;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.wrap { max-width: 68rem; margin-inline: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 2.4rem; }
.wrap > * { min-width: 0; }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.label { font: 600 .74rem/1.3 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 { font-size: clamp(2.2rem, 6vw, 3.6rem); line-height: 1.05; margin: 0; text-wrap: balance; font-weight: 600; }
h2 { font-size: 1.6rem; line-height: 1.2; margin: 0; text-wrap: balance; font-weight: 600; }
.mast { display: grid; gap: .7rem; padding-top: 2rem; }
.mast p { margin: 0; }
.mast .where { font-size: 1.15rem; }
.small { font: .85rem/1.45 var(--sans); color: var(--muted); }
.tz { font: 600 .85rem/1.4 var(--sans); }

/* Right now */
.now { background: var(--panel); border-left: 4px solid var(--accent); padding: 1.1rem 1.2rem; display: grid; gap: 1rem 2.4rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); align-items: start; }
.now h2 { font-size: 1.35rem; }
.now-col { display: grid; gap: .55rem; }
.now-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .55rem; }
.now-list li { display: grid; gap: .05rem; }
.now-list strong { font-weight: 600; }

/* Sticky controls */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); padding-block: .7rem; display: grid; grid-template-columns: minmax(0, 1fr); gap: .6rem; }
.days { display: flex; gap: .3rem; overflow-x: auto; scrollbar-width: none; }
.day { flex: none; background: none; border: 1px solid var(--rule); padding: .4rem .7rem; font: 600 .85rem/1.2 var(--sans); cursor: pointer; font-variant-numeric: tabular-nums; }
.day[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.filters { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.filters input[type="search"], .filters select { font: .9rem/1.2 var(--sans); padding: .42rem .55rem; background: var(--paper); border: 1px solid var(--rule); min-width: 0; }
.filters input[type="search"] { flex: 1 1 11rem; }
.filters select { flex: 0 1 15rem; }
.check { font: .88rem/1.2 var(--sans); display: inline-flex; gap: .35rem; align-items: center; cursor: pointer; }

/* Agenda */
.cols { display: grid; gap: 2.4rem; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 62rem) { .cols { grid-template-columns: minmax(0, 1fr) 19rem; } .side { position: sticky; top: 8rem; align-self: start; max-height: calc(100vh - 9rem); overflow-y: auto; } }
.agenda { display: grid; gap: 1.4rem; min-width: 0; }
.slot { display: grid; grid-template-columns: 5.2rem minmax(0, 1fr); gap: .8rem; border-top: 1px solid var(--rule); padding-top: .7rem; }
.slot > time { font: 600 .92rem/1.45 var(--sans); font-variant-numeric: tabular-nums; }
.slot.live > time { color: var(--accent); }
.items { display: grid; gap: 1rem; min-width: 0; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .1rem .6rem; }
.item.minor .t { font-weight: 400; }
.t { font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.loc { grid-column: 1; font: .88rem/1.4 var(--sans); }
.loc b { font-weight: 600; color: var(--accent); }
.meta { grid-column: 1; font: .82rem/1.4 var(--sans); color: var(--muted); overflow-wrap: anywhere; }
.star { grid-column: 2; grid-row: 1 / span 2; background: none; border: 0; cursor: pointer; font-size: 1.25rem; line-height: 1; padding: .1rem .2rem; color: var(--muted); min-width: 2rem; min-height: 2rem; }
.star[aria-pressed="true"] { color: var(--accent); }
.pill { font: 600 .7rem/1.3 var(--sans); letter-spacing: .04em; border: 1px solid currentColor; padding: 0 .3rem; margin-left: .25rem; white-space: nowrap; }
.pill.live { color: var(--accent); }
.cancelled .t { text-decoration: line-through; }
details { grid-column: 1 / -1; font-size: .98rem; }
summary { font: .82rem/1.6 var(--sans); color: var(--accent); cursor: pointer; }
details > div { display: grid; gap: .6rem; padding-block: .4rem .2rem; max-width: 65ch; }
details p { margin: 0; }
.empty { border-top: 1px solid var(--rule); padding-top: 1rem; color: var(--muted); }

/* Rooms */
.side { display: grid; gap: 1.4rem; align-content: start; }
.floor { display: grid; gap: .2rem; }
.room { display: block; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--rule); padding: .5rem 0; cursor: pointer; }
.room:hover .room-name, .room[aria-pressed="true"] .room-name { color: var(--accent); }
.room-name { display: block; font: 600 .92rem/1.3 var(--sans); }
.room-next { display: block; font: .8rem/1.35 var(--sans); color: var(--muted); overflow-wrap: anywhere; }

/* Off-site and gaps */
.notes { display: grid; gap: 1rem; max-width: 65ch; border-top: 1px solid var(--rule); padding-top: 1.4rem; }
.notes ul { margin: 0; padding-left: 1.1rem; display: grid; gap: .4rem; }
.notes p { margin: 0; }
.gaps { font: .84rem/1.45 var(--sans); }
@media (max-width: 30rem) { .slot { grid-template-columns: minmax(0, 1fr); gap: .35rem; } }
@media print { .bar, .star { display: none; } body { background: #fff; } }
</style>

const DATA = {"event":{"name":"AI Engineer Code Summit 2026","edition":"2026","city":"San Francisco","timezone":"America/Los_Angeles","starts_on":"2026-11-10","ends_on":"2026-11-12","status":"upcoming","official_url":"https://ai.engineer/code/2026","schedule_url":"https://ai.engineer/code/2026/schedule"},"venue":{"name":"Hilton San Francisco Union Square","address":"333 O'Farrell St, San Francisco, CA 94102","city":"San Francisco","maps_url":"https://maps.google.com/?q=Hilton+San+Francisco+Union+Square,+333+O%27Farrell+St,+San+Francisco,+CA+94102","rooms":[{"room_id":"continental-13-workshop-room-1","name":"Continental 1–3 (Workshop Room 1)","floor":"Level 2"},{"room_id":"continental-4-workshop-room-2","name":"Continental 4 (Workshop Room 2)","floor":"Level 2"},{"room_id":"continental-46-mainstage","name":"Continental 4–6 (Mainstage)","floor":"Level 2"},{"room_id":"continental-5-breakfast-lunch","name":"Continental 5 (Breakfast & Lunch)","floor":"Level 2"},{"room_id":"continental-6-workshop-room-3","name":"Continental 6 (Workshop Room 3)","floor":"Level 2"},{"room_id":"continental-7-token-billionaires-lounge","name":"Continental 7 (Token Billionaires Lounge)","floor":"Level 2"},{"room_id":"continental-79-workshop-room-4","name":"Continental 7–9 (Workshop Room 4)","floor":"Level 2"},{"room_id":"golden-gate-expo-hall-lunch-reception","name":"Golden Gate (Expo Hall, Lunch & Reception)","floor":"Level 1"},{"room_id":"registration-outside-golden-gate","name":"Registration (outside Golden Gate)","floor":"Level 1"}],"transit":null,"accessibility":null,"confirmed":true,"source_url":"https://ai.engineer/code/2026"},"days":[{"date":"2026-11-10","label":"Tue, Nov 10: Workshops & Welcome Reception","session_count":38},{"date":"2026-11-11","label":"Wed, Nov 11: Keynotes & Expo Talks","session_count":38},{"date":"2026-11-12","label":"Thu, Nov 12: Keynotes, Expo Talks & Afterparty","session_count":34},{"date":"2026-11-13","label":"Fri, Nov 13: side event, outside the main dates","session_count":1},{"date":"2026-11-14","label":"Sat, Nov 14: side event, outside the main dates","session_count":1}],"sessions":[{"id":"dee568f7-812c-423e-96f0-8bce29ddaad2","title":"Light Breakfast","abstract":null,"format":"break","room":"continental-5-breakfast-lunch","note":null,"day":"2026-11-10","start":"2026-11-10T08:00:00-08:00","end":"2026-11-10T09:00:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"627fbc54-d9e6-4366-95cd-2b70386a7ea3","title":"Registration","abstract":null,"format":"registration","room":"registration-outside-golden-gate","note":null,"day":"2026-11-10","start":"2026-11-10T08:00:00-08:00","end":"2026-11-10T17:30:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1380080","title":"MC Intro","abstract":null,"format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-10","start":"2026-11-10T08:55:00-08:00","end":"2026-11-10T09:00:00-08:00","speakers":["richelle-j"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1302670","title":"From Shared Language to Enforceable Contracts: Ontologies as Guardrails for Agents.","abstract":"This talk echoes Pocock’s “shared understanding” and augments it -- turning that language into a machine-checkable model: typed entities, relationships, allowed states, and inference rules.","format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-10","start":"2026-11-10T09:00:00-08:00","end":"2026-11-10T09:25:00-08:00","speakers":["frank-coyle"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373448","title":"Machine trust","abstract":"Agents can now work for hours, but most of us still approve every step or skip the prompts and hope. This session asks where we are on the curve for trusting agents, and what has to be true before we hand them much more work. It draws on decades of trust research, from how societies learned to trust strangers to how pilots learned to trust the autopilot. Then we use Claude Managed Agents as a reference implementation for building systems that are safe, secure and trustworthy by default.","format":"workshop","room":"continental-4-workshop-room-2","note":null,"day":"2026-11-10","start":"2026-11-10T09:00:00-08:00","end":"2026-11-10T10:00:00-08:00","speakers":["cj-avilla"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1376183","title":"New Ways of Working with Codex","abstract":"Keeping up with the rapid changes in coding agents can be exhausting. Join Dominik Kundel for a practical tour of recent features and workflows to bring you up to speed, without all the noise. We'll cover with live demos and walkthroughs how you can make the most out of your ChatGPT subscription whether you are pair programming with Codex or having your dot manage your incidents.","format":"workshop","room":"continental-6-workshop-room-3","note":null,"day":"2026-11-10","start":"2026-11-10T09:00:00-08:00","end":"2026-11-10T10:00:00-08:00","speakers":["charlie-guo","dominik-kundel"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1334020","title":"Build a Coding Agent Harness From an Empty Loop","abstract":"Start with an agent that lies about finishing, and leave with a harness you'd trust with your repo. A bare agent loop ends when the model says it's done. In my AI Engineer Europe 2026 talk, that loop hit a login page and reported success anyway. The model wasn't the problem: nothing around it checked anything. In this workshop we fix that by hand, one layer at a time, in TypeScript. We build every part of an agent harness from scratch: - **The agent loop:** call the model, run the tools it asks for, feed the results back. - **Guardrails:** iteration and context limits the model can't talk its way past. - **Context management:** what stays in the window when a run gets long. - **Deterministic verification:** read the trace, run the linter and the tests, and let a failed check overrule the model's claim. - **Retries and secrets:** a loop around the loop, and credentials the model never sees. One rule for the whole session: the prompt never changes. Every fix is code. You'll leave with a working harness on your laptop and the habit of fixing the harness before the prompt. Starting repo: https://github.com/TejasQ/basically-ai-harness","format":"workshop","room":"continental-79-workshop-room-4","note":null,"day":"2026-11-10","start":"2026-11-10T09:00:00-08:00","end":"2026-11-10T10:00:00-08:00","speakers":["tejas-kumar"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1333169","title":"One team's path to trusting AI generated code","abstract":"Our team merges 4x more pull requests than we did a year ago. Almost all of that code is AI-generated, human assisted. We tried scaling code review to match — more reviewers, AI review tools, stricter checklists — and none of it worked. What worked was stopping the fight over diffs entirely and building a verification layer around *intent*. This is the story of how one engineering team replaced the PR review bottleneck with an intent-driven verification workflow: capturing what a change *should* do before a single line is generated, encoding team standards as reusable invariants, and letting deterministic checks — not tired reviewers — produce the evidence that a change is safe to ship. I'll walk through the specific practices that made the difference — especially how we turned years of recurring review comments into machine-enforceable invariants — and share the results, the failures, and what we'd do differently.","format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-10","start":"2026-11-10T09:30:00-08:00","end":"2026-11-10T09:55:00-08:00","speakers":["ankit-jain"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1379134","title":"Scott Tolinski, Co-host, Syntax","abstract":null,"format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-10","start":"2026-11-10T10:10:00-08:00","end":"2026-11-10T10:35:00-08:00","speakers":["scott-tolinski"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1356771","title":"Forget AGI. You're Surrounded by Low-Hanging Fruit.","abstract":"Software development lifecycles are full of slow processes you can automate. Let's fix those before we go pretend to be AI astronauts. We'll cover a range of easy-to-adopt techniques for that kind of automation, and for pushing back against the agent-supercharged entropy that keeps trying to make your codebase slop out of control. You'll leave with prompts, skills and workflows you can put to work the same afternoon.","format":"workshop","room":"continental-4-workshop-room-2","note":null,"day":"2026-11-10","start":"2026-11-10T10:10:00-08:00","end":"2026-11-10T11:10:00-08:00","speakers":["lucas-meijer"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373449","title":"Build a Multi-Agent PR Review and Repair Workflow with Omnigent","abstract":"Build a GitHub CI workflow that uses specialist agents to review pull requests, coordinate bounded repairs, and validate the resulting changes. In this hands-on workshop, you’ll connect agents across models and coding harnesses, define their roles and permissions, and test the pipeline while Omnigent handles session lifecycles, delegation, and messaging. We’ll draw on how Omnigent uses its own agents to manage incoming issues and contributions as an active open-source project, examining what it takes to turn review findings into tested changes ready for human approval. You’ll leave with version-controlled agent configurations and a runnable workflow you can adapt to your own projects.","format":"workshop","room":"continental-6-workshop-room-3","note":null,"day":"2026-11-10","start":"2026-11-10T10:10:00-08:00","end":"2026-11-10T11:10:00-08:00","speakers":["bradford-chang","elise-gonzales"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373450","title":"Stop Prompting, Start Delegating: Hand off work to a team of agents","abstract":"Most teams still use agents one task at a time: prompt, wait, review, repeat. In this hands-on workshop, you'll go further and hand an entire stream of work to agents with Factory. Bring your laptop. We'll take a real project from goal to merged PRs, setting up the scope, guardrails, and review checkpoints that make delegation safe. You'll leave with a workstream running and a playbook for deciding what to hand off next.","format":"workshop","room":"continental-79-workshop-room-4","note":null,"day":"2026-11-10","start":"2026-11-10T10:10:00-08:00","end":"2026-11-10T11:10:00-08:00","speakers":["ross-cefalu"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1357063","title":"One Rule, One Throwaway Skill: Agent Migrations with ast-grep","abstract":"Coding agents struggle with large migrations. A migration produces thousands of diffs, agents apply the same fix five different ways, and nobody can reliably say how much work remains. I migrated a production codebase to Effect by pairing each change with an ast-grep rule that matches the old pattern and a temporary skill that tells an agent how to fix a match. The list of matches told agents what to work on and told me how much was left. It also divided the work across parallel agents without overlap. But agents could also make a match disappear without fixing it, so I had to write rules that were hard to evade. I’ll show how the rule and skill pair worked on a real migration and what I would change next time.","format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-10","start":"2026-11-10T10:40:00-08:00","end":"2026-11-10T11:05:00-08:00","speakers":["justin-poehnelt"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"a8ad909b-f03d-416b-99e7-591813ebb8e5","title":"Networking Break","abstract":null,"format":"break","room":"continental-5-breakfast-lunch","note":null,"day":"2026-11-10","start":"2026-11-10T11:10:00-08:00","end":"2026-11-10T11:40:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1334659","title":"Inference Engineering for Coding Agents","abstract":"Coding agents are a dominant use case for LLMs, but they tend to use generalized inference setups even at large scale. Like any optimization problem, in inference you can get better results with better constraints. This talk shares specific techniques that you can apply when building an inference service for exclusive use in coding agents, including targeted quantization and pruning schemes, domain-specific post-training, KV cache management around compaction events, subagent session affinity in a world of autoscaling and load balancing, and code-specific speculative decoding techniques across both common model-based approaches (DFlash, DSpark, EAGLE) and deterministic speculation using n-grams.","format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-10","start":"2026-11-10T11:40:00-08:00","end":"2026-11-10T12:05:00-08:00","speakers":["philip-kiely"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373451","title":"Build Your Own Agent Harness with eve and Vercel","abstract":"What does it take to build an agent that works across users, tools, and shared environments? In this hands-on workshop, we’ll introduce eve, Vercel’s agent framework, and explore the fundamentals of building your own agent harness. We’ll walk through the architecture behind multiplayer agents and how Vercel’s infrastructure fits together: Workflows for durable execution, Sandbox for isolated code execution, and AI Gateway for model access. Then we’ll put these concepts into practice through a guided exercise you can adapt to your own use case. You’ll leave with a practical understanding of the pieces behind an agent harness and a starting point for building and running your own agents on Vercel. Bring your laptop for the hands-on portion.","format":"workshop","room":"continental-4-workshop-room-2","note":null,"day":"2026-11-10","start":"2026-11-10T11:40:00-08:00","end":"2026-11-10T12:40:00-08:00","speakers":["owen-kephart"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1381709","title":"Ahmad Osman, Founder & CEO, Osmantic","abstract":null,"format":"workshop","room":"continental-6-workshop-room-3","note":null,"day":"2026-11-10","start":"2026-11-10T11:40:00-08:00","end":"2026-11-10T12:40:00-08:00","speakers":["ahmad-osman"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373453","title":"Closing the Agentic Loop: Getting Agents to Safely Build, Verify, and Ship","abstract":"Agents can write code. That's not the hard part anymore. The hard part is trusting what they ship. In this hands-on workshop, I'll show you the loop I run every day: agents safely build, verify, and deploy the outcomes I want, and that loop is hooked up to signal (my own ideas, user feedback, bug reports, and friction) so it keeps itself going. I haven't read 1% of the code in my product, and agents author and merge most of the PRs. That only works because of the system around them. We'll start by running autopilot (npx kcd-skills@latest autopilot) on a real repo, yours if you want, and use the questions it asks to lay the foundation: invariants, decision records that say when it's OK to change them, a primitives catalog, and an AGENTS.md that's a router, not a novel. Then we'll get into verification. That means separate reviewer agents, PR templates that have you review systems instead of code, cloud agents with their own computers that show their work, and a control CLI your agents maintain for themselves. Finally, we'll limit the blast radius with feature flags, health checks, and backups you've actually restored, and wire up the loops that keep it all moving. Bring a laptop and a repo you own. What you'll walk away with: - An autopilot plan for your own repo, with each step your agents can take on next - A primitives catalog and invariants your agents actually follow - A PR template built around intent, one-way vs. two-way doors, and system diagrams, so you review systems instead of code - A verification setup: an AI reviewer, agents that test the running app, and a control CLI they maintain - A blast-radius checklist: flags with an owner, a metric, and a removal condition, health checks after deploy, and tested restores - The loops that keep it going: bug reports, user feedback, friction, and nightly cleanup Prerequisites: nothing to install ahead of time, but a good internet connection matters. To follow along on your own code, bring a laptop with a coding agent you already use (Cursor, Claude Code, Codex, etc.) signed in, plus a GitHub repo you own and can open pull requests on.","format":"workshop","room":"continental-79-workshop-room-4","note":null,"day":"2026-11-10","start":"2026-11-10T11:40:00-08:00","end":"2026-11-10T12:40:00-08:00","speakers":["kent-c-dodds"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1381496","title":"Sydney Runkle, Product Manager, LangChain","abstract":null,"format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-10","start":"2026-11-10T12:10:00-08:00","end":"2026-11-10T12:35:00-08:00","speakers":["sydney-runkle"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"29c87f1a-5570-4b60-9165-36e259a6aa07","title":"Lunch","abstract":null,"format":"break","room":"continental-5-breakfast-lunch","note":null,"day":"2026-11-10","start":"2026-11-10T12:40:00-08:00","end":"2026-11-10T13:50:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1341863","title":"From Coding agents to Knowledge work agents","abstract":"How harness evolved from code to Knowledge work","format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-10","start":"2026-11-10T13:50:00-08:00","end":"2026-11-10T14:15:00-08:00","speakers":["karan-vaidya"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373447","title":"Philipp Schmid, Thor Schaeff & Ivan Leo, Members of Technical Staff, Google DeepMind (Part 1)","abstract":null,"format":"workshop","room":"continental-4-workshop-room-2","note":null,"day":"2026-11-10","start":"2026-11-10T13:50:00-08:00","end":"2026-11-10T14:50:00-08:00","speakers":["ivan-leo","philipp-schmid","thor-schaeff"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1376182","title":"A Field Guide to Agent Shapes: From Long-Horizon to Open-Ended","abstract":"Agents in 2026 split into a bunch of distinct shapes like externalized context with RLMs, agents messaging each other, harnesses the agent rewrites itself, sandboxes, orchestrators with sub-agents, and brute-force recombination. This talk goes through what each one helps with, then looks at three real deployments in industries/domains generally lagging in AI adoption that reused some of these patterns. We finish on where this is heading in 2027 with models that edit their own context, tweak other networks, get trained for exploration earlier, and learn continuously from tasks they generate themselves.","format":"workshop","room":"continental-6-workshop-room-3","note":null,"day":"2026-11-10","start":"2026-11-10T13:50:00-08:00","end":"2026-11-10T14:50:00-08:00","speakers":["yacine-mahdid"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1357839","title":"Keep the Harness, Own Your Inference","abstract":"Claude Code without Claude. Codex without an OpenAI model. We’ll put both harnesses to work on a real codebase with open-weight models running on a DGX Spark. They’ll inspect the repository, change code, and test their work. The terminal experience stays familiar. The entire stack runs on hardware you control. Drawing on our work building vLLM Agentic API, we’ll show how we’re bringing familiar coding harnesses to inference engines and distributed serving stacks including vLLM, SGLang, NVIDIA Dynamo, and llm-d. The goal is to make the harness, model, and serving infrastructure independent choices. With Codex Cloud, the coding harness itself runs remotely. Behind that harness, the Responses API adds another layer of agentic execution: the server can manage conversations, execute tools, and retrieve context. We’ll open up that machinery and explore how responsibility gets divided between the harness and the agentic server. Drawing on our work building vLLM Agentic API, we’ll dig into conversation state, memory through retrieval and file search, and compaction: what the agent remembers, how it finds what it needs, and what survives when its context fills up. As more of the agent runs on servers, owning your inference means understanding—and controlling—this execution stack. You’ll leave with the setup and verification steps to run your own coding agent backend—from a DGX Spark on your desk to a shared GPU cluster. Choose the model, choose the engine, and scale the infrastructure while keeping the coding tools you already use. Key takeaways - Run it locally: connect Codex and Claude Code to open-weight inference on an NVIDIA DGX Spark. - Take it to a cluster: connect the same agent-facing API layer to distributed serving with llm-d or NVIDIA Dynamo. - Make the whole session work: preserve conversation history, tool handoffs, and streaming across backends, then verify the result through a completed coding task.","format":"workshop","room":"continental-79-workshop-room-4","note":null,"day":"2026-11-10","start":"2026-11-10T13:50:00-08:00","end":"2026-11-10T14:50:00-08:00","speakers":["francisco-javier-arceo"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1356697","title":"The new job of the data team is providing context to AI","abstract":"Business intelligence is dead; long live context! The new job of every data team is to provide context to AI, so that when your head of sales asks “give me your 3 best ideas for improving pipeline conversion”, it gives 3 great answers grounded in accurate, correct queries. The tools for providing this solution are the same tools you know and love: AI is just a new consumer of the data stack. Fivetran + dbt labs CEO George Fraser will take you through how real users solve this problem today, and demo live how to connect AI to real data.","format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-10","start":"2026-11-10T14:20:00-08:00","end":"2026-11-10T14:45:00-08:00","speakers":["george-fraser"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1352199","title":"Building a Shared AI Assistant: The Platform Challenges Beyond MCP","abstract":"Two years ago, teams asked our platform team to connect their data to an AI assistant. Today they ship their own MCP servers in a week. That speed is a win, and it swaps one engineering problem for a harder one: how do you decide what gets through, what gets gated, and who owns the gates? This talk gives you a way to answer that — what stays team-owned, what becomes shared platform, and how to tell whether consolidating actually helped. At Netflix, bringing these tools together creates real value. Functions like Finance and Talent can now connect information that previously lived in separate systems. A business user can ask a question in one place instead of taking it to three teams. But that same reach creates ambiguity. Multiple tools expose different versions of the same entity, or claim to answer the same question. As the catalog grows, the assistant has more ways to choose incorrectly. Sometimes a data-owning team discovers that another team has built on its data only when an evaluation fails. How do you build a shared AI assistant that brings tools and data from across a company into one place? At Netflix, product teams increasingly build their own MCP integrations. Our challenge is making those capabilities work together so employees can get answers across teams through a single assistant. This talk covers the decisions and mechanisms behind that shift: connector certification, an internal benchmark built from real employee queries that we use to evaluate routing between overlapping tools, and how we classify actions to separate what an agent can do on its own from what needs a person first. We'll examine where our initial domain boundaries broke down, what required agreement between teams, and why better tool descriptions alone couldn't resolve the conflicts. We'll close on what we haven't solved: who owns the authoritative version of an entity, how to retire a connector other teams depend on, and when the benefits of a shared capability justify the coordination it requires.","format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-10","start":"2026-11-10T15:00:00-08:00","end":"2026-11-10T15:25:00-08:00","speakers":["utkarsh-shrivastava"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373612","title":"Philipp Schmid, Thor Schaeff & Ivan Leo, Members of Technical Staff, Google DeepMind (Part 2)","abstract":null,"format":"workshop","room":"continental-4-workshop-room-2","note":null,"day":"2026-11-10","start":"2026-11-10T15:00:00-08:00","end":"2026-11-10T16:00:00-08:00","speakers":["ivan-leo","philipp-schmid","thor-schaeff"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1357867","title":"Hands-on Gitar: An AI Code Verification Agent for Your CI","abstract":"Gitar is Sonar’s AI code verification agent, complementing SonarQube with an understanding of each change’s context and intent. In this hands-on workshop, you’ll install Gitar as a GitHub App and use it across three pull request scenarios that show how verification goes beyond code review. Gitar verifies every change against your project's context and rules, catches problems, generates working fixes, and iterates until your CI pipeline passes. You'll leave knowing how to set up Gitar on your own repositories. You'll also see how it delivers ready-to-merge, green PRs with high signal and low noise, while your team keeps control.","format":"workshop","room":"continental-6-workshop-room-3","note":null,"day":"2026-11-10","start":"2026-11-10T15:00:00-08:00","end":"2026-11-10T16:00:00-08:00","speakers":["taylor-luttrell-williams"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373454","title":"Build a personal agent with Exa Search","abstract":"A personal agent gets asked everyday questions: where to eat near the office that's open late, whether it will rain on Saturday, how the Warriors did last night, what a stock did this week. Exa answers all of these through one search call. Places come back with addresses, hours and reviews; weather comes back as daily forecasts; sports come back as scores, standings and schedules. You don't need a separate API for each. In this session, Jakub Hojsan, forward deployed engineer at Exa you show you how to build a personal agent on Exa search that handles a day's worth of real requests, from finding dinner to planning around the weather. We will provide a repo to work out of as part of this workshop.","format":"workshop","room":"continental-79-workshop-room-4","note":null,"day":"2026-11-10","start":"2026-11-10T15:00:00-08:00","end":"2026-11-10T16:00:00-08:00","speakers":["jakub-hojsan"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1334565","title":"Building World-class Agentic GTM: Learnings from Monaco for Monaco","abstract":"Building a custom agents platform is one of the key pieces to unlocking AI for complex verticalized business workflows. Monte Carlo is the sales-specific system we've built to help scale Monaco's revenue: a platform where revenue teams encode their own playbooks as agents that run against everything we've ingested about their business, including pipeline, outbound, calls, and the CRM. Sales is a particularly complex vertical for the following reasons: no two revenue orgs look alike, the data is large and heterogeneous, and the expertise that matters lives in per-rep workflows nobody has written down. Over the last 2 years, we’ve built a custom harness and orchestration system to power our world-class GTM team. In this talk, I'll break down the components a verticalized agent platform needs in order to be fast and correct, including an execution plane, memory and curated implicit and explicit context, how expertise gets represented, and the evaluation loop, along with what is still unresolved.","format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-10","start":"2026-11-10T15:30:00-08:00","end":"2026-11-10T15:55:00-08:00","speakers":["mihail-eric"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"3e1a3db8-9da0-4015-af37-7277b48182cb","title":"Networking Break","abstract":null,"format":"break","room":"continental-5-breakfast-lunch","note":null,"day":"2026-11-10","start":"2026-11-10T16:00:00-08:00","end":"2026-11-10T16:30:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1356850","title":"Catching Reward Hacking From the Inside","abstract":"Congrats! Your agent passed every test. But did it fix the bug in your code, or did it just learn how to cheat its way through the tests? The July incident where OpenAI’s agents escaped their sandbox and breached Hugging Face made unaligned agentic behavior a mainstream headline. Reward hacking, eval awareness and cyber misuse are difficult to spot with black box methods, like output filters and LLM judge monitors. As a result, unaligned behavior can go undetected. At Goodfire, we build monitors that read model’s internal activations. Interpretability lets us find representations tied to behaviors like reward hacking, awareness of being evaluated, and offensive cyber activity, then build into probes that fire while the model is still generating a response. That means we can sometimes catch a model heading toward bad behavior before it even happens. In this talk, I’ll walk through how we deploy activation monitors production and share lessons from real deployments with frontier labs and inference providers. I’ll share a recent example of how our monitors caught a coding agent building a seemingly innocuous test program well before the agent ultimately used it to cheat, and how our platform saves on compute by monitoring activations the model is already generating. I’ll also walk through how activation monitoring fits into a larger, multi-layer defense system and how to set the right thresholds for intervention.","format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-10","start":"2026-11-10T16:30:00-08:00","end":"2026-11-10T16:55:00-08:00","speakers":["daniel-balsam"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1304940","title":"Our Agents Shipped 6,000 PRs to 600+ Companies in The First Month. Now They Build Features","abstract":"PostHog Self-driving wrote 6,000+ pull requests in its first month that 600+ companies chose to merge. We showed the signal-to-PR pipeline at AI Engineer in London this April, and released it in late June. I'll show what happened since: where agents overreached, what we threw away, what's still science fiction, and the jump from fixing bugs to building features. The system now pitches features backed by your product data, builds them, and reviews them paranoidly, testing like a real customer. All open source. Real PRs, real reviews, real failures, shown live.","format":"workshop","room":"continental-4-workshop-room-2","note":null,"day":"2026-11-10","start":"2026-11-10T16:30:00-08:00","end":"2026-11-10T17:30:00-08:00","speakers":["alex-lebedev"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"7840ea51-d307-4cab-b034-00cfc661ab26","title":"Cognition Workshop","abstract":null,"format":null,"room":"continental-6-workshop-room-3","note":null,"day":"2026-11-10","start":"2026-11-10T16:30:00-08:00","end":"2026-11-10T17:30:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1375631","title":"Build your first Kiro Crew app: An agent that triages your backlog while you sleep","abstract":"Most people meet AI agents as a chat bot. In this hands-on workshop you will build one that works while you are not watching. Starting from an empty directory, you will install Kiro Crew, an open-source orchestration layer for coding agents, and ship a working app: an agent that reads your repository’s open issues, finds the duplicates, explains why it thinks so, and posts its findings on a schedule. Along the way you will give the agent persistent memory so it stops re-reading what it already knows, fan the work out across background subagents so a thousand issues do not take a thousand turns, and set the boundary that decides what it may and may not touch. Bring a laptop and a GitHub repository you care about. You will leave with the app running, and with a clear picture of what separates a demo from something you would actually let run unattended.","format":"workshop","room":"continental-79-workshop-room-4","note":null,"day":"2026-11-10","start":"2026-11-10T16:30:00-08:00","end":"2026-11-10T17:30:00-08:00","speakers":["arundeep-nagaraj","dan-kiuna"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1359774","title":"Sandboxes are dead","abstract":"Everyone and their mother has built a sandbox company. Good news: sandboxes are dead. Why is the CEO of E2B telling you sandboxes are dead? Shouldn’t he be telling you the opposite? In this talk, you’ll learn why sandboxes took off, exactly where they break down for agents, and what I believe will replace them: a private cloud for every agent task that reshapes its infrastructure on the fly to fit whatever the agent needs. You’ll leave fully AI-pilled about the future of the cloud. Your agent is ready to keep going, but your infrastructure is waiting for a human.","format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-10","start":"2026-11-10T17:00:00-08:00","end":"2026-11-10T17:25:00-08:00","speakers":["vasek-mlejnsky"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1380081","title":"MC Outro","abstract":null,"format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-10","start":"2026-11-10T17:25:00-08:00","end":"2026-11-10T17:30:00-08:00","speakers":["richelle-j"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"804ef31d-65f3-4d4f-8b16-25698ce1b28a","title":"Opening Reception","abstract":null,"format":"social","room":"golden-gate-expo-hall-lunch-reception","note":null,"day":"2026-11-10","start":"2026-11-10T17:30:00-08:00","end":"2026-11-10T20:30:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"e8b1a15a-4a96-4ef0-92d7-99ac83615e72","title":"Token Billionaires Lounge","abstract":null,"format":null,"room":"continental-7-token-billionaires-lounge","note":null,"day":"2026-11-11","start":"2026-11-11T08:00:00-08:00","end":"2026-11-11T17:40:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"f8b0a0a6-9f29-4434-92fe-694d66d20a34","title":"Registration","abstract":null,"format":"registration","room":"registration-outside-golden-gate","note":null,"day":"2026-11-11","start":"2026-11-11T08:00:00-08:00","end":"2026-11-11T17:40:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1376240","title":"MC Intro","abstract":null,"format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T09:00:00-08:00","end":"2026-11-11T09:10:00-08:00","speakers":["corey-quinn"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1352467","title":"What Will You Build When AI Is 10x Faster?","abstract":"Many AI product decisions are influenced by how long someone will wait for an answer. Do you give an agent another pass to check its answer, or make it respond faster? Can your voice assistant finish reasoning before the pause gets awkward? Faster inference gives developers the option to build smarter, more responsive user experiences. We’ll look at what faster inference lets you build, from more responsive voice applications to agents that can try, test, and update within a few seconds. We’ll discuss when speed is worth paying for, when other parts of your application become the bottleneck, and how to use higher responsiveness. Along the way, we’ll share how Gimlet combines GPUs and specialized accelerators to make inference faster, and what that means for the developers using that speed.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T09:10:00-08:00","end":"2026-11-11T09:30:00-08:00","speakers":["natalie-serrino"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373455","title":"Rethinking Claude Code Best Practices","abstract":"The models have gotten really good, and most of what we've added to our Claude Code setups over the past year is now holding them back. In this talk I'll go through what Claude Code best practices look like for the Claude 5.5 models, what's still worth keeping, and what you no longer need to think about.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T09:30:00-08:00","end":"2026-11-11T09:50:00-08:00","speakers":["lydia-hallie"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373457","title":"cloudflare is a neolab","abstract":"we trained some new system one models (clef, clairic). they fit perfectly within our decade-old primitives like workers, our edge latency hypothesis for workers ai, and our ambition to be the agent cloud.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T09:50:00-08:00","end":"2026-11-11T10:10:00-08:00","speakers":["michelle-chen"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373446","title":"All Code Is Slop (Except Mine)","abstract":"The Grok Bot team at SpaceXAI lands hundreds of PRs a day. Nobody reads them all, yet quality goes up anyway. In this talk, we'll find out how the Grok Bot team turns slop into gold at an incredible pace.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T10:10:00-08:00","end":"2026-11-11T10:30:00-08:00","speakers":["lauren-tan"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1376244","title":"MC Outro","abstract":null,"format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T10:30:00-08:00","end":"2026-11-11T10:40:00-08:00","speakers":["corey-quinn"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"a2b441c8-9b8e-489b-8da3-e6878f79cb02","title":"Networking Break","abstract":null,"format":"break","room":"golden-gate-expo-hall-lunch-reception","note":null,"day":"2026-11-11","start":"2026-11-11T10:40:00-08:00","end":"2026-11-11T11:20:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"d4b20610-7cef-463f-b607-b5a51a334993","title":"Expo Hall Hours","abstract":null,"format":null,"room":"golden-gate-expo-hall-lunch-reception","note":null,"day":"2026-11-11","start":"2026-11-11T10:40:00-08:00","end":"2026-11-11T16:00:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1380068","title":"Manage Yourself Out of the Loop","abstract":"More coding agents mostly means more tabs to watch. In the past year, one of our engineers went from about 20 merged pull requests a month to nearly 7,000. I'll show what we changed in our repos so an agent can take one small feature from prompt to merge on its own.","format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-11","start":"2026-11-11T10:55:00-08:00","end":"2026-11-11T11:15:00-08:00","speakers":["erik-thorelli"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373458","title":"Refactor or Rot: Building a self-improving codebase","abstract":"Your coding agents run in loops: plan, implement, test, repeat. This inner loop focuses on completing a task, and it tends to get all the attention. But there’s an outer loop, too. Each agent builds on the codebase the last one left behind, inheriting its patterns, abstractions, and shortcuts. Those patterns can make the codebase easier to understand, maintain, and extend, or compound complexity and make future changes riskier. In this talk, I’ll show you how to build an outer loop that reinforces code quality and counteracts decay. Drawing on classic software design and refactoring techniques, we’ll equip an agent with skills to identify code smells, reason about coupling and module boundaries, and recommend refactors that make future changes easier. We’ll wire that analysis into the development lifecycle, running on PRs and across the codebase, weighing each recommendation’s benefit against its cost and risk. You’ll learn when to refactor, when to leave working code alone, and how to make refactoring part of your development workflow, so your coding agents leave behind codebases that are better, not just bigger.","format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-11","start":"2026-11-11T11:20:00-08:00","end":"2026-11-11T11:40:00-08:00","speakers":["jacob-prall"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1323755","title":"I deleted 90% of my harness (And It Got Better)","abstract":"Alt Title: Why Models Are Superhuman with Bash (Where Humans Fail) --- I spent my day to day building a agents with custom tools for everything. Every few month I decide to delete everything and see what is not needed anymore. I stripped out every dedicated tool until only Bash remained. I cut the prompt to 300 tokens and made the execution loop asynchronous. Benchmark scores jumped. Experience went up. Rich Sutton called this the Bitter Lesson: building human heuristics into AI always loses to general methods backed by compute. Models are now superhuman with the bash. A frontier model can synthesize an ad-hoc 15-line pipeline combining Python AST parsing, ripgrep, git diffs, and subshells in 200ms to make progress on a users task, there is no need for dedicated edits, search or grep tools anymore. Learn how to delete your code.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T11:20:00-08:00","end":"2026-11-11T11:40:00-08:00","speakers":["philipp-schmid"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373460","title":"Heal Your Agents, Don't Just Grade Them","abstract":"Your evals are green, and users are still hitting failures. The evals aren't wrong. They test what you anticipated, and production at millions of sessions a day keeps inventing failures nobody wrote a test for, many visible only as a pattern across sessions. Detecting those failures continuously is a hard problem in its own right. Every agent fails differently, the failures that matter are rare, and a detector that flags everything is as useless as one that flags nothing. We've been working on this with customers running agents at scale and by running it on our own agents, learning which failures are worth surfacing and which are just noise. Along the way, three engineering problems kept coming up: Economics: you can't afford to run a reasoning model over every session, so what do you screen with, and what earns a closer look? Noise: a thousand flagged sessions are usually a handful of root causes. How do you collapse them and decide which to fix first? Trust: when a coding agent proposes the fix as a pull request, what has to be true before you merge it? How do you verify each fix and expand to cover every failure you find so it stays caught? You'll leave with the tradeoffs that matter when you move from grading agents to healing them, drawn from teams doing it today","format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-11","start":"2026-11-11T11:45:00-08:00","end":"2026-11-11T12:05:00-08:00","speakers":["khasimul-asif-mohammad","sudhir-tonse"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373459","title":"The Rise of the Agent Workforce: Rethinking Agent Infrastructure","abstract":"The next generation of agents won't just answer questions. They'll work autonomously, collaborate with other agents, and learn from experience. As we move from interactive chatbots to persistent agent workforces, the infrastructure powering them needs to fundamentally evolve. In this talk, we'll explore the emerging architecture of agentic systems, from stateful sandboxes and persistent memory to agent communication and orchestration. We'll examine why today's agent platforms aren't built for this future, and what it will take to power a world where teams of agents can tackle complex, long-running work together.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T11:45:00-08:00","end":"2026-11-11T12:05:00-08:00","speakers":["ankit-mathur"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373462","title":"How to build agents over your own data","abstract":"The biggest bottleneck to building powerful internal agents is giving them the right organizational context. When agents can reliably find that context, they can answer questions, review code, investigate incidents, and automate workflows across the company. But company knowledge is scattered across Slack, email, Google Drive, code repositories, Linear, internal documentation, and multiple versions of the same information. Putting everything into the model’s context is expensive, risky, and often reduces answer quality. Connecting every source through separate MCP servers creates another bottleneck: the agent must make numerous tool calls while inheriting each service’s latency, rate limits, and uneven search quality. This talk shows how to separate retrieval from reasoning by giving internal agents a unified search layer for company knowledge. We’ll explore how a search subagent breaks down complex tasks, combines semantic and exact retrieval across systems, preserves source permissions, verifies freshness and versions, and returns compact, cited evidence to the acting agent. Through realistic internal workflows, we’ll demonstrate how better retrieval makes agents more accurate, traceable, and useful while reducing tool calls, latency, and cost.","format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-11","start":"2026-11-11T12:10:00-08:00","end":"2026-11-11T12:30:00-08:00","speakers":["aamir-shakir"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373461","title":"Building a Safe Software Factory","abstract":"Coding agents have made code cheap to write, and teams are shipping 10× more changes than they did two years ago. Human review was built for human speed, so the industry is moving from reviewed PRs to automated software factories. At Gitar and Sonar, we are learning how to build a safe software factory, with layers of verification across the system. We'll share what we've been learned so far, and where we think this trend is headed.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T12:10:00-08:00","end":"2026-11-11T12:30:00-08:00","speakers":["andrew-finch"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373464","title":"The Software Factory That Needs Zero FDEs","abstract":"Working alone with Claude feels like a superpower. You open a session, give it the right context, and watch it ship. Scaling that to a whole engineering org is where it breaks. One agent with more context, more tools and more responsibility starts drifting, costs climb, and nobody can tell which part failed. So most \"AI software factories\" quietly ship with a team of forward-deployed engineers who wire up every customer by hand. We built Overcut so a factory doesn't need them. Instead of one big agent, it uses small agents with clear jobs: triage, root-cause analysis, implementation, code review and verification. Each one has its own context, model and memory, so it can be measured and improved on its own. Orchestration connects them. Workflows react to events in GitHub, Jira and Slack, run in parallel, and stop at human approval gates where it matters. Because every piece is a reusable building block, teams assemble their factory from ready-made parts instead of waiting for someone to build it for them. Then we'll prove it live. Starting from an empty project, we'll build the factory on stage: a production alert in Slack becomes a Jira ticket with a root-cause analysis, the ticket becomes a pull request, and the PR is reviewed and fixed until it's ready to merge. No FDEs, no hand-wiring. You'll leave with architecture patterns you can apply tomorrow , whether you're one developer or rolling out agents across a whole company.","format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-11","start":"2026-11-11T12:35:00-08:00","end":"2026-11-11T12:55:00-08:00","speakers":["raz-berman-gold"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373463","title":"Earning Autonomy: From Missions to Workstreams","abstract":"Seven months ago, Factory introduced Missions, an orchestrator that ran worker agents through a full project with validation at every milestone. Real customer projects showed its limits. It only handled code, it was built for older models, and its context belonged to one person instead of the team. Luke Alvoeiro explains how Factory rebuilt it. A more token-efficient Droid made running many agents affordable. Environments let agents scale out inside a customer's own VPC. The new Missions gives each project a long-lived home with one orchestrator, shared context, and more autonomy as validation earns trust. When a project moves into maintenance, its mission graduates into a workstream: agents that turn bug reports, alerts, and ideas into validated, shipped software.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T12:35:00-08:00","end":"2026-11-11T12:55:00-08:00","speakers":["luke-alvoeiro"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"d3d5809a-6087-496f-8f90-9bb417a58d02","title":"Lunch","abstract":null,"format":"break","room":"golden-gate-expo-hall-lunch-reception","note":null,"day":"2026-11-11","start":"2026-11-11T12:55:00-08:00","end":"2026-11-11T14:05:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373466","title":"Coding Agents and How to Tame Them","abstract":"Coding agents are remarkably capable one minute and burning 50,000 tokens in a broken loop the next. Over the past few months at Google DeepMind, I've worked with Kaggle to audit over 50 coding benchmarks trace by trace and build a platform to evaluate frontier agents at scale. In this short 18-minute talk, we'll cover the weird failure modes we caught in the wild, the lessons we learned building air-gapped sandboxes, and how to take those same lessons to design better harnesses, verifiers, and coding environments for your own agents.","format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-11","start":"2026-11-11T14:05:00-08:00","end":"2026-11-11T14:25:00-08:00","speakers":["ivan-leo"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373465","title":"Diogo Almeida, Co-founder, TypeSafe AI","abstract":null,"format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T14:05:00-08:00","end":"2026-11-11T14:23:00-08:00","speakers":["diogo-almeida"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1357875","title":"More Checks, Less Noise: Layered Security for AI-Assisted Development","abstract":"More security checks should mean more confidence, not more alerts to ignore. As AI accelerates code production, how do we add independent verification without turning development into an obstacle course? This session explores two dimensions of application security: using complementary analysis methods and placing checks at useful points throughout the software development lifecycle. We’ll examine where deterministic analysis provides repeatable checks, where probabilistic, AI-powered review can add context-sensitive reasoning, and why simply stacking tools can create more noise than assurance. We’ll start with a vendor-neutral framework for choosing checks, prioritizing findings, and keeping review actionable. Then, a live demo will bring three complementary approaches together: static application security testing (SAST), software composition analysis (SCA), and AI-powered analysis of logic-level vulnerabilities. You’ll leave with a practical way to evaluate layered verification: what each check contributes, where it belongs, and how to turn its findings into manageable work rather than another queue of alerts.","format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-11","start":"2026-11-11T14:30:00-08:00","end":"2026-11-11T14:50:00-08:00","speakers":["killian-carlsen-phelan","taylor-luttrell-williams"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1374818","title":"Beyond Generation: Fast, Structured AI Decisions with Jev at Glean","abstract":"Not every step in an AI product needs a full generative LLM call. Many are bounded decisions, like understanding what a user is asking for, picking the best suggestion to show, checking whether an answer's citations hold up, routing to the right tool or model, or deciding if a request needs a guardrail. In this session, I'll walk through how Glean has been exploring Jev across these decisions, what we learned about where fast, confidence-scored decisions shine, and how we evaluate these models before they reach users.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T14:30:00-08:00","end":"2026-11-11T14:43:00-08:00","speakers":["chinmay-goyal"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1374822","title":"J Stack","abstract":"At UiPath, we didn't just adopt Jev. We built a family around it. We have enabled Jev as a direct node in Flow (Our Agentic Process Automation Canvas). JExtract pulls structured data out of documents, JRank reranks retrieval results, JEval measures whether our agents actually work, and JMine powers our dynamic mining layer. Seeing massive cost and speed improvements Each one also runs inside our agentic flows. This talk tours the J-Stack: the problem behind each member, the design choices that held up in production, and may be some Jokes along the way.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T14:48:00-08:00","end":"2026-11-11T15:01:00-08:00","speakers":["chibi-vikram","kevin-bernstein"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373467","title":"Ground Truth or Dare: Using Oracles to Make Postgres Reactive","abstract":"Live SQL is the holy grail of realtime. Subscribe to any SQL query, with joins, aggregates and ordering, and the result stays live as your data changes. It’s easy to describe but very hard to build. At Electric, we spent years chasing it. Then we joined Neon and built it in weeks with coding agents, inside Postgres. Live queries are database infrastructure. This isn’t code you hand to an agent and hope for the best. So we used Postgres’s own query engine as an oracle. Once the agents had the ability to verify their own work, they could go super fast and burn down through the featue requirements. In this talk, I’ll cover what we built, how we built it and how oracles let us have both truth and dare: to get it right and ship fast with agents.","format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-11","start":"2026-11-11T14:55:00-08:00","end":"2026-11-11T15:15:00-08:00","speakers":["james-arthur"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1376197","title":"Your Judge Is Hallucinating Too","abstract":"Every step an agent takes in ZoomInfo's Agent Teams is graded by another model. Then we ran Jev beside it and found the grader was passing work that never happened. This talk is about what we found, what we replaced, and why \"did the agent do a good job?\" is the wrong question to ask a model.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T15:06:00-08:00","end":"2026-11-11T15:19:00-08:00","speakers":["brian-kennedy"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373468","title":"CVE remediation with Factory: from finding to merged PR","abstract":null,"format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-11","start":"2026-11-11T15:20:00-08:00","end":"2026-11-11T15:40:00-08:00","speakers":["nikhil-harithas"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1376198","title":"Scott Roberts, Workday","abstract":null,"format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T15:24:00-08:00","end":"2026-11-11T15:37:00-08:00","speakers":["scott-roberts"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1380927","title":"Leaving Localhost: Building an Agent-Native Dev Environment","abstract":"Why is it that Anthropic can port Bun from Zig to Rust in 11 days, while most teams still struggle to make sweeping changes to production software? Bun is complex, but it turns out its verification loop is actually quite clear: there's a well-defined TypeScript spec, and a huge battery of tests the agent can iterate against. This talk will explore techniques to build agent-native dev environments in the cloud that allow for these kinds of tight verification loops for software that's traditionally much harder to verify: tax accounting, vertical AI agents, robotics control systems, etc. We'll discuss how to manage stateful dependencies (databases, queues, caches), third-party services, and seed data so you can focus on architecture & product while your agents handle implementation & testing in the cloud.","format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-11","start":"2026-11-11T15:45:00-08:00","end":"2026-11-11T16:05:00-08:00","speakers":["sajid-mehmood"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"222dd686-32de-4bf1-81fe-53ca33a74d1b","title":"Afternoon Break / Keynote Reset","abstract":null,"format":"break","room":"golden-gate-expo-hall-lunch-reception","note":null,"day":"2026-11-11","start":"2026-11-11T15:45:00-08:00","end":"2026-11-11T16:05:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1376245","title":"MC Intro","abstract":null,"format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T16:20:00-08:00","end":"2026-11-11T16:30:00-08:00","speakers":["corey-quinn"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373469","title":"What it takes to set intelligence free","abstract":"Models keep getting better and the systems we build around them need to keep up. This talk goes inside Lovable’s engineering: forkable computers that give agents room to experiment, persistent histories that let them continue longer work, and durable communication that lets them coordinate. We’ll explore what it takes to give agents more independence, and how these foundations could help them build, ship, learn from feedback, and keep improving a product.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T16:30:00-08:00","end":"2026-11-11T16:50:00-08:00","speakers":["fabian-hedin"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373470","title":"How to build an agent that builds the culture","abstract":"Ramp built its own coding agent, Inspect, which writes ~75% of merged PRs. At the start of 2026, the technology was the novel part, but today, it's commonplace. In this talk, Zach will talk about how Inspect has evolved this year, and re-shaped the culture of engineering at Ramp around agent-driven development.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T16:50:00-08:00","end":"2026-11-11T17:10:00-08:00","speakers":["zach-bruggeman"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373471","title":"Steve Yegge, Independent Advisor & Creator of Beads & Gas Town, Independent","abstract":null,"format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T17:10:00-08:00","end":"2026-11-11T17:30:00-08:00","speakers":["steve-yegge"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1376191","title":"Simon Willison, Creator of Datasette, Independent","abstract":null,"format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T17:30:00-08:00","end":"2026-11-11T17:50:00-08:00","speakers":["simon-willison"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1376246","title":"MC Outro","abstract":null,"format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-11","start":"2026-11-11T17:50:00-08:00","end":"2026-11-11T18:00:00-08:00","speakers":["corey-quinn"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"allthings-aie@2026-11-11T19:00:00-08:00","title":"allthings/aie","abstract":"Free, approval-only community night after the talks: lightning hot takes, open mic, music, and performances. No sponsored talks, no pitches.","format":"social","room":null,"note":"Place not published: the official page gives none and the Luma address is guests-only","day":"2026-11-11","start":"2026-11-11T19:00:00-08:00","end":"2026-11-11T22:00:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026"},{"id":"2f9774d5-ce23-415d-8047-2ffd94f4ee61","title":"Token Billionaires Lounge","abstract":null,"format":null,"room":"continental-7-token-billionaires-lounge","note":null,"day":"2026-11-12","start":"2026-11-12T08:00:00-08:00","end":"2026-11-12T17:40:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"57c167d1-4feb-4c9d-aff2-94d59b9f831c","title":"Registration","abstract":null,"format":"registration","room":"registration-outside-golden-gate","note":null,"day":"2026-11-12","start":"2026-11-12T08:00:00-08:00","end":"2026-11-12T17:40:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1380094","title":"MC Intro","abstract":null,"format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-12","start":"2026-11-12T09:00:00-08:00","end":"2026-11-12T09:10:00-08:00","speakers":["corey-quinn"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1379009","title":"Jason Liu, Developer Experience Engineer, OpenAI","abstract":null,"format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-12","start":"2026-11-12T09:10:00-08:00","end":"2026-11-12T09:30:00-08:00","speakers":["jason-liu"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373472","title":"Armin Ronacher, CTO, Earendil","abstract":null,"format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-12","start":"2026-11-12T09:30:00-08:00","end":"2026-11-12T09:50:00-08:00","speakers":["armin-ronacher"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373473","title":"Software Engineering Is Becoming Factory Engineering","abstract":"Warp founder and CEO Zach Lloyd explores the rise of software factories: systems that coordinate AI agents across the entire development lifecycle, from triage and specification to implementation, review, and monitoring. He’ll explain how engineering teams can build factories that improve with every run, where human judgment remains essential, and why the next frontier of software engineering may be less about writing code and more about engineering the systems that build it.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-12","start":"2026-11-12T09:50:00-08:00","end":"2026-11-12T10:10:00-08:00","speakers":["zach-lloyd"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1378217","title":"Brandon Thomas, CEO, Artcraft","abstract":null,"format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-12","start":"2026-11-12T10:10:00-08:00","end":"2026-11-12T10:30:00-08:00","speakers":["brandon-thomas"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1380095","title":"MC Outro","abstract":null,"format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-12","start":"2026-11-12T10:30:00-08:00","end":"2026-11-12T10:40:00-08:00","speakers":["corey-quinn"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"0ac34d11-ab5e-4861-88ce-4bbde76dfb23","title":"Networking Break","abstract":null,"format":"break","room":"golden-gate-expo-hall-lunch-reception","note":null,"day":"2026-11-12","start":"2026-11-12T10:40:00-08:00","end":"2026-11-12T11:20:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"76f554f5-942f-4a36-86c4-09ed972006fc","title":"Expo Hall Hours","abstract":null,"format":null,"room":"golden-gate-expo-hall-lunch-reception","note":null,"day":"2026-11-12","start":"2026-11-12T10:40:00-08:00","end":"2026-11-12T16:00:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373476","title":"Emitted, not authored: The context layer under your software factory","abstract":"It's your first week on the team. You read everything attached to your first ticket: the README, the wiki, the Linear project. You ship the PR. The review comes back from a senior engineer: \"we stopped doing it this way in March, the vendor doesn't accept that shape anymore.\" Nobody wrote that down. It lived in a Slack thread from an incident two months ago and in the heads of the people who were up that night fixing it. You learned it by getting it wrong. That's how most engineering knowledge gets earned. Not from documentation someone sat down to write, but from the act of the work itself: the pull request comments, the chat thread where a feature got argued out, the incident channel while people are still responding, the support channel where a customer explained what they actually needed. I call this emitted context. It was just typed, by people, doing their jobs. Authored context is what the team decides matters: the rules and skills files for agents, the wikis and READMEs we curate. High leverage, worth doing well. Emitted context is what the team told each other while doing the work. Your agents today are you, the new hire, on every single task, and they never get to build tribal knowledge. Letting them build it is a lot harder than connecting a Slack MCP. Emitted context contradicts itself, goes stale overnight, and includes things not everyone is allowed to see. This talk is about the context layer that handles that: surfacing context nobody authored, reconciling it with citations, keeping it fresh, with no human in the loop. Automate a factory on authored context alone and it can only act on what somebody remembered to write down, and no one person knows everything the team knows. I'll run the same task with and without emitted context, show why agents don't stop to ask for what they're missing, and cover the three things we got wrong building this. You'll leave with open source tools we extracted from our context layer, and a clear read on whether your agents can unblock themselves or if you're trapped in the factory.","format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-12","start":"2026-11-12T11:20:00-08:00","end":"2026-11-12T11:40:00-08:00","speakers":["brandon-waselnuk"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373475","title":"Walden Yan, Chief Product Officer, Cognition","abstract":null,"format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-12","start":"2026-11-12T11:20:00-08:00","end":"2026-11-12T11:40:00-08:00","speakers":["walden-yan"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1379052","title":"Talk But Verify: human-in-the-loop for agents that actually matter","abstract":"AI agents are getting good at taking action. The hard part isn't making them capable, it's knowing when to make them stop. In this talk we'll walk through the full spectrum of human-in-the-loop patterns, from lightweight inline confirmations to out-of-band permission gates to handing your agent a wallet with real money in it and more. Each pattern fits a different level of consequence, and knowing which to reach for is what separates demo agents from production ones. We'll cover the honest tradeoffs of latency, user experience, and trust so you can make the right call for your specific use case. The entire talk is built around various live demos that escalate in stakes with every step. You'll leave with a mental model and working reference architecture you can apply the same day.","format":"talk","room":"continental-13-workshop-room-1","note":null,"day":"2026-11-12","start":"2026-11-12T11:45:00-08:00","end":"2026-11-12T12:05:00-08:00","speakers":["michael-liendo"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373477","title":"What Your AI Doesn't Know: The latest trends in agent searches","abstract":"An agent only searches when it doesn’t know something. In other words, every search is a confession, and Exa has been collecting them from thousands of agents for two years. Read together, those searches form a map of how AI agents like to work, and where their knowledge ends. There’s clear evidence of growing expertise. Coding agents used to search for examples and tutorials, now they go straight to the source, searching for code repos, issues and API references. Searches for mature frameworks like React, Next.js, and the rest of the “vibe code stack” are fading, not because they’re falling out of use, but because models already know them cold. Instead agents are searching for their own tools: MCPs, skills, agent instruction files and the latest models. But even as their knowledge and capability grows, agents still need to search. Models still take months to train, but the c
