g Is Becoming Factory Engineering","abstract":"Warp founder and CEO Zach Lloyd explores the rise of software factories: systems that coordinate AI agents across the entire development lifecycle, from triage and specification to implementation, review, and monitoring. He’ll explain how engineering teams can build factories that improve with every run, where human judgment remains essential, and why the next frontier of software engineering may be less about writing code and more about engineering the systems that build it.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-12","start":"2026-11-12T09:50:00-08:00","end":"2026-11-12T10:10:00-08:00","speakers":["zach-lloyd"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1378217","title":"Let's Open Source the World","abstract":"From open-source alternatives to Adobe Photoshop and Microsoft Office to the SaaSpocalypse, it’s clear that software’s moats aren’t where they used to be. Take a look inside ArtCraft, a project aiming to become the Wikipedia of open source by recreating every category of software in modern, high-quality Rust. We’re building open-source applications and infrastructure to make every platform open - tearing down moats by turning platforms into protocols. We’ll tour fully agentic software factories and the engineering behind them - pushing the limits of Git and GitHub, tackling Rust build and CI bottlenecks, automating triage and testing, and building high-quality shared libraries and UI/UX components for the interfaces and user experiences of today and tomorrow, and beyond.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-12","start":"2026-11-12T10:10:00-08:00","end":"2026-11-12T10:30:00-08:00","speakers":["brandon-thomas"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1380095","title":"MC Outro","abstract":null,"format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-12","start":"2026-11-12T10:30:00-08:00","end":"2026-11-12T10:40:00-08:00","speakers":["corey-quinn"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"0ac34d11-ab5e-4861-88ce-4bbde76dfb23","title":"Networking Break","abstract":null,"format":"break","room":"golden-gate-expo-hall-lunch-reception","note":null,"day":"2026-11-12","start":"2026-11-12T10:40:00-08:00","end":"2026-11-12T11:20:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"76f554f5-942f-4a36-86c4-09ed972006fc","title":"Expo Hall Hours","abstract":null,"format":null,"room":"golden-gate-expo-hall-lunch-reception","note":null,"day":"2026-11-12","start":"2026-11-12T10:40:00-08:00","end":"2026-11-12T16:00:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373476","title":"Connect Agents to Reality: The Context Engine Powering Your Software Factory","abstract":"Our goal is to drive business outcomes and increase shareholder value. We do it through code. Increasingly agents are writing more, if not all, of our code and running more of the SDLC through software factories. Unfortunately they keep getting things wrong, are misaligned, or hallucinate facts leading to wasted human and agent cycles. It doesn't have to be this way. By connecting agents to the reality of your business through a context engine you can improve every step of your factory. This drastically increases the quality of agent outputs which compounds into driving the business outcomes and value we dream of. In this talk I'll show: how to accomplish this, why context != context, and 3 lessons we learned delivering a context engine at scale in case you want to build your own. Whether you believe one agent can run it all or a bespoke software factory is the right approach, you'll discover that ambient context is what your system is missing.","format":"talk","room":"continental-13-expo-sessions","note":null,"day":"2026-11-12","start":"2026-11-12T11:20:00-08:00","end":"2026-11-12T11:40:00-08:00","speakers":["brandon-waselnuk"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373475","title":"A New Age of Software Engineering","abstract":"Skip the basics and go straight to the frontier. Walden Yan, cofounder and CPO of Cognition, dives into the most advanced ways teams are using AI today, with bleeding-edge techniques from real company use cases.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-12","start":"2026-11-12T11:20:00-08:00","end":"2026-11-12T11:40:00-08:00","speakers":["walden-yan"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1379052","title":"Talk But Verify: human-in-the-loop for agents that actually matter","abstract":"AI agents are getting good at taking action. The hard part isn't making them capable, it's knowing when to make them stop. In this talk we'll walk through the full spectrum of human-in-the-loop patterns, from lightweight inline confirmations to out-of-band permission gates to handing your agent a wallet with real money in it and more. Each pattern fits a different level of consequence, and knowing which to reach for is what separates demo agents from production ones. We'll cover the honest tradeoffs of latency, user experience, and trust so you can make the right call for your specific use case. The entire talk is built around various live demos that escalate in stakes with every step. You'll leave with a mental model and working reference architecture you can apply the same day.","format":"talk","room":"continental-13-expo-sessions","note":null,"day":"2026-11-12","start":"2026-11-12T11:45:00-08:00","end":"2026-11-12T12:05:00-08:00","speakers":["michael-liendo"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373477","title":"What Your AI Doesn't Know: The latest trends in agent searches","abstract":"An agent only searches when it doesn’t know something. In other words, every search is a confession, and Exa has been collecting them from thousands of agents for two years. Read together, those searches form a map of how AI agents like to work, and where their knowledge ends. There’s clear evidence of growing expertise. Coding agents used to search for examples and tutorials, now they go straight to the source, searching for code repos, issues and API references. Searches for mature frameworks like React, Next.js, and the rest of the “vibe code stack” are fading, not because they’re falling out of use, but because models already know them cold. Instead agents are searching for their own tools: MCPs, skills, agent instruction files and the latest models. But even as their knowledge and capability grows, agents still need to search. Models still take months to train, but the coding frontier now turns over every quarter, and AI is speeding that up. This knowledge cutoff won’t be fixed by the next big model release. In this keynote, Jeff Pinner, CTO of Exa, shares what we’ve learned from agents telling us what they don’t know, what it means for anyone who maintains a library, ships an agent or relies on one, and why search is an Agent’s best gateway to the present.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-12","start":"2026-11-12T11:45:00-08:00","end":"2026-11-12T12:05:00-08:00","speakers":["jeffrey-pinner"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1379011","title":"Let the Agent Cook: From APIs to Answers","abstract":"Abstract: Give an agent a pile of APIs. Can it figure out what to query, connect the dots, and check its own answers? I’ll share practical lessons on building agents that explore data across services—from discovering tools and navigating schemas to following leads and knowing when they have enough evidence.","format":"talk","room":"continental-13-expo-sessions","note":null,"day":"2026-11-12","start":"2026-11-12T12:10:00-08:00","end":"2026-11-12T12:30:00-08:00","speakers":["arsalan-bashir"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1375634","title":"Ship more as a team with Kiro Crew","abstract":"Coding has gotten cheaper, but shipping hasn't. See how one engineer built a build, review, and ship loop with Kiro Crew, and learn the traps that cost hours along the way (reviews that never end, agent loops that balloon a ten-line fix into a whole subsystem, saying yes to everything because code felt free). You'll leave with five concrete habits to try Monday morning with the tools you already use.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-12","start":"2026-11-12T12:10:00-08:00","end":"2026-11-12T12:30:00-08:00","speakers":["doug-clauson"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1379163","title":"Code review without reviewing code","abstract":"While authoring code has become virtually instantaneous, reviewing and verifying that code in an enterprise environment remains constrained by human cognitive capacity. At scale, this becomes a painful bottleneck: pull request volume and size are growing rapidly, review latency is increasing, and 10,000-line diffs can all too easily burn through finite reserves of human attention. How do engineering organizations scale trust and quality at the speed of AI generation? I won’t pretend we’ve fully slain this dragon, but in this session I’ll walk through a few different approaches we’re taking and what we’ve learned within Atlassian: Inner Loop: Building confidence through automated local AI review and skills for catching anti-patterns and contract violations before code ever reaches a human teammate. Outer Loop: How tools like Taro spin up live environments, simulate user interactions, and provide tangible evidence (narrated videos) directly to reviewers. A New Lens on Code: Aggregating quality signals like CI, agentic evaluations, and risk scoring to allow reviewers to “zoom out” and reason about the value and implications of a change without having to read the diff line-by-line. Rethinking the Unit of Change: Why the traditional single-ticket micro-PR is an artifact of human typing limits, and how we can shift human expertise to where it matters most. Attendees will leave with concrete architectural patterns, lessons learned from real-world rollouts, and a blueprint for evolving their team’s code review practices for the AI era.","format":"talk","room":"continental-13-expo-sessions","note":null,"day":"2026-11-12","start":"2026-11-12T12:35:00-08:00","end":"2026-11-12T12:55:00-08:00","speakers":["daniel-tao"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1379010","title":"Exploring Claude’s frontier","abstract":"In this talk, we explore Claude’s frontier capabilities in memory and multi-agent coordination.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-12","start":"2026-11-12T12:35:00-08:00","end":"2026-11-12T12:55:00-08:00","speakers":["lance-martin"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"0d41a8b7-3e4d-4487-895e-c3330d82620e","title":"Lunch","abstract":null,"format":"break","room":"golden-gate-expo-hall-lunch-reception","note":null,"day":"2026-11-12","start":"2026-11-12T12:55:00-08:00","end":"2026-11-12T14:05:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1380658","title":"Scaling Your Agent Workforce: Lessons from Inside Cognition","abstract":"Most companies have turned coding agents on. Few can say what those agents do or what they return. At Cognition, Devin wrote 92% of merged PRs in September, and 9 out of 10 Devin sessions start without a human. Theodor Marcu shows how we got there: cloud agents working in parallel, automations that run every night, and how engineering and research use Devin to autonomously drive feature development. He then turns that into a playbook for your teams: govern what agents can reach, route work across models to cut cost, and follow every session to a merged PR so ROI is measured instead of guessed.","format":"talk","room":"continental-13-expo-sessions","note":null,"day":"2026-11-12","start":"2026-11-12T14:05:00-08:00","end":"2026-11-12T14:25:00-08:00","speakers":["theodor-marcu"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373478","title":"Jarred Sumner, Founder of Bun, Anthropic / Bun","abstract":null,"format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-12","start":"2026-11-12T14:05:00-08:00","end":"2026-11-12T14:50:00-08:00","speakers":["jarred-sumner"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1381580","title":"The first Grounded Decision Model","abstract":"Decision models only read. They never generate a token, which is why they cost roughly 240x less per token read than a frontier LLM — and why they are only as good as the state you hand them. For most judgments worth making, that state lives on the live web, not in your database. This talk re-costs the stack with measured numbers. On PWS-Decisions, our open 300-question benchmark, the question is 104 tokens and the evidence needed to answer it is 4,777. Two years ago the model was 86% of the bill for a grounded answer; today it is 17%. Intelligence stopped being the bottleneck. Context became it. We will cover what that inversion changes architecturally, a live demo that grounds 18 typed questions against 4,270 businesses in a single call, and the entity-resolution failure that quietly breaks grounded decisions in production. You will leave able to run the benchmark against your own model.","format":"talk","room":"continental-13-expo-sessions","note":null,"day":"2026-11-12","start":"2026-11-12T14:30:00-08:00","end":"2026-11-12T14:50:00-08:00","speakers":["devin-gupta"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373479","title":"Your agent pays twice for every search: how we cut token spend by 90+% with better accuracy","abstract":"Every agent that searches the web pays twice: once for the search call, and again for the tokens that search puts into the model's context. The answer is usually a few sentences. The agent pays for the whole page, and in a multi-step loop it pays for it again on every turn. We'll show real production traces of where the tokens go and why retrieval, not generation, is the biggest line on most agent bills. Then we'll show what we changed: return the passages a query needs instead of whole pages, tune extraction to the question, and cap how much context the agent can take. We tested this across 12 frontier models and 11,000 blind-graded answers. Token spend fell by more than 90% while accuracy went up. You get a metric (cost per correct answer, not cost per request), an open calculator to run the numbers on your own traffic, and a five-point checklist for finding token waste in your pipeline.","format":"talk","room":"continental-13-expo-sessions","note":null,"day":"2026-11-12","start":"2026-11-12T14:55:00-08:00","end":"2026-11-12T15:15:00-08:00","speakers":["louis-walsh"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1376195","title":"Judgement is the Last Job","abstract":"If agents can build anything, what's left? Building Antigravity, we work at the frontier of AI, ship products at the scale of Google, and iterate quickly to harness new model capabilities. This talk dives into that feedback loop, and what that taught us about building with agents while keeping human judgement at the center.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-12","start":"2026-11-12T14:55:00-08:00","end":"2026-11-12T15:15:00-08:00","speakers":["ishaan-dey"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1375635","title":"Agents That Don't Clock Out","abstract":"My coding agents are fast, but speed isn't the whole story. The real question is where they run: the CLI, the IDE, or something else entirely? In this session, I'll break down which tool fits which job and why that choice makes or breaks your workflow. I'll show you how I organize skills and custom agents so they're reusable instead of one-off, then close with a demo of a persistent agent setup in Kiro Crew — one that keeps grinding away long after I've logged off. Walk away knowing how to match the right agent to the right environment and build setups that work while you sleep.","format":"talk","room":"continental-13-expo-sessions","note":null,"day":"2026-11-12","start":"2026-11-12T15:20:00-08:00","end":"2026-11-12T15:40:00-08:00","speakers":["erik-hanchett"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373480","title":"Brownfield Factories","abstract":"Brownfield applications are clearly ideal for Software Factories! Brownfield applications provide all the specification and telemetry you need to build validation harnesses and loops. Make a lump sum payment on your technical debt, reduce costs, increase performance, and purge vulnerabilities once and for all. Rewrite that boat anchor to Rust, Elixir or BF today!","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-12","start":"2026-11-12T15:20:00-08:00","end":"2026-11-12T15:40:00-08:00","speakers":["justin-mccarthy"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"066d8991-0108-4be6-8b75-6f423e76bafa","title":"Afternoon Break / Keynote Reset","abstract":null,"format":"break","room":"golden-gate-expo-hall-lunch-reception","note":null,"day":"2026-11-12","start":"2026-11-12T15:45:00-08:00","end":"2026-11-12T16:05:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1380097","title":"MC Intro","abstract":null,"format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-12","start":"2026-11-12T16:20:00-08:00","end":"2026-11-12T16:30:00-08:00","speakers":["corey-quinn"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373474","title":"Post-Training Gemini 4 for Real Engineering Work","abstract":"Real software engineering tasks are not asking a model to write a function, but long tasks (o(hours) reading unfamiliar code, running tools, recovering from wrong turns, and knowing when the job is actually done. In this keynote, Melvin Johnson (VP, Google DeepMind) covers how we post-trained for long-horizon agentic coding: - Hard tasks. Popular benchmarks saturate, so we built internal realistic, multi-step software tasks. - Graders that can't be gamed. When agents learn to satisfy unit tests without solving the problem, you need graders that check the work the way a reviewer would. - Model behavior. An agent that says \"fixed it\" when it didn't is worse than no agent. We reward models for reporting accurately what they did and didn't do. - Efficiency over long horizons. Finishing more of the task with fewer tokens and stable behavior across very long contexts. - Shipping weekly. Modular improvements and dogfooding with Google engineers let us release in weeks instead of quarters.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-12","start":"2026-11-12T16:30:00-08:00","end":"2026-11-12T16:50:00-08:00","speakers":["melvin-johnson"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373481","title":"A Company Built Around the Agent","abstract":"You might know Amp as one of the agent products, but we're really a 21-cofounder team figuring out how to build our entire company around the agent. We don't have traditional roles, everyone pushes to main, we have one meeting per week, we're very profitable and above $100M ARR, and we haven't hired anyone (yet). See how we use the agent to do everything, with high quality, and what relics of the old tech company world we ditched.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-12","start":"2026-11-12T16:50:00-08:00","end":"2026-11-12T17:10:00-08:00","speakers":["quinn-slack"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1325061","title":"12-Factor-Factories: Design Patterns for Agentic Coding","abstract":"Every AI lab is building full stack cloud agents. Every enterprise is building their own software factory. We've worked with a lot of teams adopting all flavors in every combination. In this talk we'll distill out the core principles and design patterns we've seen across factories, and make a case for why the AI-native forge will be composable and built on open primitives.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-12","start":"2026-11-12T17:10:00-08:00","end":"2026-11-12T17:30:00-08:00","speakers":["dexter-horthy"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1373482","title":"Thariq Shihipar, Independent","abstract":null,"format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-12","start":"2026-11-12T17:30:00-08:00","end":"2026-11-12T17:50:00-08:00","speakers":["thariq-shihipar"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"1380098","title":"Something to Celebrate","abstract":"To close Code Summit 2026, swyx invites everyone to celebrate together: three days of talks, workshops, hallway conversations and the AI engineers who made them happen. Stay for the finale and celebrate with us.","format":"talk","room":"continental-46-mainstage","note":null,"day":"2026-11-12","start":"2026-11-12T17:50:00-08:00","end":"2026-11-12T18:00:00-08:00","speakers":["swyx"],"status":"scheduled","source":"https://ai.engineer/code/2026/schedule"},{"id":"official-after-party@2026-11-12T18:30:00-08:00","title":"Official After Party","abstract":"Close out Code Summit with the people building the AI coding stack. Hosted by Neon, Vercel, and Factory. Bring your badge or ticket to get in.","format":"social","room":null,"note":"Financial District, San Francisco","day":"2026-11-12","start":"2026-11-12T18:30:00-08:00","end":"2026-11-12T21:30:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026"},{"id":"aie-x-mlh-hackathon@2026-11-13T09:00:00-08:00","title":"AIE x MLH Hackathon","abstract":"Code Summit wraps up, but the ideas don't have to. Major League Hacking hosts a full-day hackathon for Summit attendees to take what they learned and build something with it.","format":"side-event","room":null,"note":"South Beach, San Francisco (per Luma; exact address guests-only)","day":"2026-11-13","start":"2026-11-13T09:00:00-08:00","end":"2026-11-13T21:00:00-08:00","speakers":[],"status":"scheduled","source":"https://ai.engineer/code/2026"},{"id":"ai-engineer-kids-day@2026-11-14T12:30:00-08:00","title":"AI Engineer Kids Day","abstract":"Our first Code Summit Kids Day: a hands-on afternoon for curious young builders to explore AI and code with Cassandra Chin, speaker, developer, and book author.","format":"side-event","room":null,"note":"SoMa, San Francisco","day":"2026-11-14","start":"2026-11-14T12:30:00-08:00","end":"2026-11-14T15:30:00-08:00","speakers":["cassandra-chin"],"status":"scheduled","source":"https://ai.engineer/code/2026"}],"speakers":{"aamir-shakir":{"name":"Aamir Shakir","affiliation":"Mixedbread","bio":"Aamir Shakir is the Founder and CEO of Mixedbread, where he builds retrieval systems for complex, unstructured data. His work spans multimodal search, reranking, and specialized search agents.","links":[]},"ahmad-osman":{"name":"Ahmad Osman","affiliation":"Osmantic","bio":"Ahmad Osman is the Founder & CEO of Osmantic, which builds private AI infrastructure and ODS, the open-source Osmantic Deployment System for local and hybrid AI. His work spans inference, agents, self-hosted deployments, and the hardware behind them. He moderates r/LocalLLaMA, has spoken and led workshops at AI Engineer World's Fair, and has been featured by Latent Space and The Washington Post.","links":["https://ahmadosman.com","https://github.com/theahmadosman","https://www.linkedin.com/in/theahmadosman","https://x.com/theahmadosman"]},"alex-lebedev":{"name":"Alex Lebedev","affiliation":"PostHog","bio":"Hey, I'm Alex. I've been building AI products since early GPT-3, most of my code is open source (250+ PRs), and I actively work on putting myself out of a job by improving code generation and code reviews. Today I'm an AI Product Engineer at PostHog, building distributed multi-agent systems from zero. Before that: video analysis for my own startup, Hotjar's first AI features, and working on the scrapy crawling library. Before engineering: 7+ years in marketing and project management. I talk at events a lot, usually with live demos that can fail miserably (but thankfully don't).","links":["https://posthog.com/","https://www.linkedin.com/in/nightowlcoder/","https://x.com/nightowl_coder"]},"andrew-finch":{"name":"Andrew Finch","affiliation":"Sonar","bio":"Full-stack software engineer and tech lead. Building Gitar. Formerly at Forward, Uber.","links":["https://github.com/afincha","https://www.linkedin.com/in/andrewafinch"]},"ankit-jain":{"name":"Ankit Jain","affiliation":"Aviator","bio":"Ankit Jain is a founder and CEO of Aviator, a developer productivity platform used by modern engineering teams to ship AI-generated code at scale — without the review bottlenecks, broken builds, or brittle deployments. He also leads The Hangar, a community of senior engineers and engineering leaders focused on developer experience, and Xoogler, the ex-Google alumni network.","links":["https://aviator.co","https://github.com/jainankit","https://twitter.com/ankitxg","https://www.aviator.co/blog/author/ankitjain/page/4","https://www.linkedin.com/in/ankitjaindce","https://www.linkedin.com/in/ankitjaindce/","https://x.com/ankitxg"]},"ankit-mathur":{"name":"Ankit Mathur","affiliation":"Databricks","bio":"Ankit Mathur is the engineering lead for AI Infrastructure at Databricks. During his time, he's helping build scalable systems for LLM serving, smart routing, agent deployment, and more.","links":[]},"armin-ronacher":{"name":"Armin Ronacher","affiliation":"Earendil","bio":"Armin Ronacher created Flask and Jinja, foundational tools for building websites in Python, and co-founded Earendil, a public-benefit company developing open, human-directed AI software. After a decade at Sentry, he has become a distinctive voice on coding agents: generating software faster helps only when engineers retain enough understanding to remain responsible for it.","links":["https://github.com/mitsuhiko","https://lucumr.pocoo.org","https://www.linkedin.com/in/arminronacher","https://x.com/mitsuhiko"]},"arsalan-bashir":{"name":"Arsalan Bashir","affiliation":"Sentry","bio":"Arsalan Bashir is a Staff Software Engineer, AI at Sentry, building tools that help developers and their AI agents find and fix broken code faster.","links":[]},"arundeep-nagaraj":{"name":"Arundeep Nagaraj","affiliation":"AWS","bio":"Arundeep is a technologist and engineering leader with 15+ years of progressive responsibility across customer success, solutions architecture, and developer experience at AWS and Cisco. He leads customer success and solutions architecture for Kiro, an agentic engineering solution spanning IDE, CLI, Web, Crew, and Mobile. He has built in-product experiences that drive adoption and owns kiro.dev from content strategy to infrastructure. Outside of work and hiking trails in North Carolina, he enjoys playing sports (Basketball, Tennis and Chess).","links":["https://x.com/arun_deepn"]},"bradford-chang":{"name":"Bradford Chang","affiliation":"Databricks","bio":"Bradford Chang is a Senior Solutions Architect at Databricks, helping media and entertainment companies transform their business with data and AI. Previously, he worked in games at AWS and healthcare at Orion Health. He studied Computer Science at the University of Southern California and loves deploying AI agents to solve real problems.","links":[]},"brandon-thomas":{"name":"Brandon Thomas","affiliation":"ArtCraft","bio":"Brandon Thomas is a filmmaker and engineer who founded ArtCraft for himself and the people he makes films with. He wanted directors working with AI-generated images and video to be able to place actors and frame a shot before choosing a model to render it.","links":["https://brand.io/","https://github.com/echelon","https://x.com/echelon"]},"brandon-waselnuk":{"name":"Brandon Waselnuk","affiliation":"Unblocked","bio":"Brandon Waselnuk is Developer Relations at Unblocked, the context layer for agentic software development. He previously led product at Mintlify and co-founded Squire AI, an AI code review platform. A Y Combinator alum (S21) and Venture Partner at Pioneer Fund, Brandon also led product initiatives at IBM, helping create Design Thinking @ IBM and managing portfolio planning for IBM's $1B+ Business Analytics division. He's passionate about building tools that make engineering teams more productive.","links":["https://github.com/baell","https://waselnuk.com/","https://x.com/brandonwaselnuk"]},"brian-kennedy":{"name":"Brian Kennedy","affiliation":"ZoomInfo","bio":"Brian Kennedy is a Principal Engineer at ZoomInfo, leading engineering for the Agentic AI Platform that powers Agent Teams and over a hundred production agents. He has spent the last year on the runtime underneath them: the orchestrator, the gates that decide whether a step counts, and the evals that keep the whole thing honest. Before that he spent a decade at early-stage startups, most recently building generative AI platforms and products.","links":["https://www.linkedin.com/in/brianpk/"]},"cassandra-chin":{"name":"Cassandra Chin","affiliation":"and Kids Workshop Instructor","bio":"Cassandra Chin is a keynote speaker at Devnexus, JFokus, Devoxx Belgium, Devoxx Morocco, and GIDS, and author of Apress’s Raising Young Coders. She has taught technology workshops for kids at international conferences since age 13 and advocates for women, minorities, and underserved students in tech. She is Content Chair of CNCF Kids Day, helps run AI Engineer Kids Day, and has been featured at KubeCon + CloudNativeCon, theCUBE, and Techstrong TV.","links":["https://linkedin.com/in/cassandra-chin-developer","https://twitter.com/@cassandraonjava"]},"charlie-guo":{"name":"Charlie Guo","affiliation":"OpenAI","bio":"Charlie Guo is a Developer Experience Engineer at OpenAI, where he helps developers build with the OpenAI API. He is also the author of Artificial Ignorance, an AI publication at the intersection of engineering and intelligence. Before joining OpenAI, Charlie spent more than a decade building products and internal tools, including as a startup founder. He is based in Berkeley, California.","links":["https://www.ignorance.ai/","https://www.linkedin.com/in/charlierguo","https://x.com/charlierguo"]},"charlie-meyer":{"name":"Charlie Meyer","affiliation":"Cognition","bio":"Charlie Meyer is a Special Projects Engineer at Cognition. He studies Computer Science at the University of Virginia as an Echols Scholar and is broadly interested in ML/RL, alignment, AI for math, and web design.","links":["https://charliemeyer.xyz/","https://www.linkedin.com/in/charlie-meyer-loves-you"]},"chibi-vikram":{"name":"Chibi Vikram","affiliation":"UiPath","bio":"Chibi Chakaravarthi is an engineer at UiPath building the infrastructure behind its AI agents, from evaluation pipelines to the serverless systems that run them at scale. Chibi’s work focuses on making agentic systems measurable and reliable enough to ship to enterprise customers. Lately, that has meant bringing Jev into flows, extraction, reranking, and internal tools across the product. Chibi enjoys turning research ideas into production systems that real teams depend on.","links":["https://www.uipath.com/"]},"chinmay-goyal":{"name":"Chinmay Goyal","affiliation":"Glean","bio":"Chinmay Goyal is a software engineer at Glean, where he works on AI agents and Glean Assistant. His work focuses on building agent experiences and the backend systems that support them.","links":["https://www.glean.com/"]},"cj-avilla":{"name":"CJ Avilla","affiliation":"Anthropic","bio":"CJ Avilla works on platform and developer experience at Anthropic, helping developers build with Claude. His work spans documentation, quickstarts, cookbooks, and SDK examples: the materials developers use to turn an API into a working application.","links":["https://github.com/cjavdev","https://linkedin.com/in/cjavilla/","https://www.cjav.dev/","https://x.com/cjav_dev"]},"corey-quinn":{"name":"Corey Quinn","affiliation":"The Duckbill Group","bio":"Corey Quinn is the Chief Cloud Economist at Duckbill. His unique brand of snark combines with a deep understanding of AWS's offerings, unlocking a level of insight that's both penetrating and hilarious. He lives in San Francisco with his spouse and daughters.","links":["https://www.linkedin.com/in/coquinn/"]},"dan-kiuna":{"name":"Dan Kiuna","affiliation":"AWS","bio":"Dan is a Specialist Solutions Architect at AWS where he works on Kiro, an AI coding tool with an IDE, CLI, Web, and a workspace called Crew. His focus is on integrations through agent plugins, MCP, and Crew apps. Before Kiro, he worked on AWS AppSync and AWS Amplify. In his free time, he enjoys playing guitar, piano, pool, and spending time with his family.","links":["https://github.com/nadetastic","https://nadetastic.com/","https://www.linkedin.com/in/dan-kiuna/","https://x.com/nadetastic"]},"daniel-tao":{"name":"Daniel Tao","affiliation":"Atlassian","bio":"Daniel Tao is Lead Principal Engineer for Dev Infra at Atlassian, responsible for technical leadership and development of solutions that power all of Atlassian’s engineering efforts. Dan previously served as Head of Engineering for multiple Atlassian products, including Confluence, Bitbucket, Compass, and DevOps Products. Dan's professional experience prior to Atlassian includes engineering roles at Google, ThoughtWorks, and multiple startups across a diverse set of industries including finance, law, entertainment, education, and retail.","links":["https://philosopherdeveloper.com/","https://www.linkedin.com/in/dantao/"]},"devin-gupta":{"name":"Devin Gupta","affiliation":"Parallel","bio":"Devin Gupta is a core engineer at Parallel Web Systems, focusing on building out the next generation of web infrastructure for LLMs. In particular, he works on post-training search models and leading the Parallel Decisions API. Before this, he worked in long/short investing at Balyasny and got his physics degree at Stanford.","links":["https://devin-gupta.github.io/","https://www.linkedin.com/in/devin-gupta/","https://x.com/devingupta_"]},"dexter-horthy":{"name":"Dexter Horthy","affiliation":"HumanLayer","bio":"Dex is CEO and co-founder at HumanLayer, building an agentic IDE and collaboration platform that helps teams solve hard problems in complex codebases without devolving into slop. Dex coined the term context engineering in April 2025, has keynoted AI Engineer conferences and his practical, no-hype talks on agentic coding have over 1 million views on YouTube. Dex built lunar exploration tooling for NASA researchers in high school, and spent 10+ years in the Kubernetes/Infra space before getting into AI.","links":["https://theouterloop.substack.com","https://twitter.com/dexhorthy","https://www.linkedin.com/in/dexterihorthy"]},"diogo-almeida":{"name":"Diogo Almeida","affiliation":"TypeSafe AI","bio":"Diogo Almeida is co-founder and chief executive of TypeSafe AI, where he is building Jev, an AI model that returns typed decisions and probabilities directly to software. At OpenAI, he coauthored InstructGPT, helping develop the human-feedback training behind conversational AI. His subsequent work tackles a limitation he sees in that approach: a model can produce responses people prefer without being ready to make unattended operational decisions.","links":["https://typesafe.ai","https://www.linkedin.com/in/diogomda","https://x.com/completeskeptic"]},"dominik-kundel":{"name":"Dominik Kundel","affiliation":"OpenAI","bio":"Dominik Kundel works on developer experience and SDKs at OpenAI, building the infrastructure that turns powerful models into usable, controllable software agents. He co-designed and implemented the OpenAI Agents SDK for TypeScript with Kazuhiro Sera and has contributed to Codex, gpt-oss and a Rust library for rendering the Harmony format.","links":["https://dkundel.com","https://github.com/dkundel","https://www.linkedin.com/in/dkundel","https://x.com/dkundel"]},"doug-clauson":{"name":"Doug Clauson","affiliation":"AWS","bio":"Doug Clauson is a Principal Product Manager for Kiro, where he leads Kiro CLI and many core agent capabilities. He has been with AWS for the last 5 years, managing developer tools, and is an active builder. Prior to AWS he was in aerospace building flight simulation software and aircraft technology. Ask him about the time he built real life X wings for Walt Disney World!","links":[]},"elise-gonzales":{"name":"Elise Gonzales","affiliation":"Databricks","bio":"Elise Gonzales is the Product Manager for Omnigent at Databricks. Previously, she's worked for Microsoft on HoloLens, Amazon Alexa, and several start-ups in the data space. She went to Carnegie Mellon for Computer Science and enjoys working on complex, data-intensive products.","links":[]},"erik-hanchett":{"name":"Erik Hanchett","affiliation":"AWS","bio":"Erik Hanchett is a Senior Developer Advocate at AWS and creator of Program With Erik, a software development YouTube channel with more than 100,000 subscribers. He has taught developers for over a decade, written two books on web development, and spoken around the world. His recent work focuses on AI agents.","links":["https://facebook.com/computation","https://twitter.com/ErikCH","https://www.linkedin.com/in/erikhanchett/"]},"erik-thorelli":{"name":"Erik Thorelli","affiliation":"CodeRabbit","bio":"Erik Thorelli is Head of Developer Experience at CodeRabbit, where he works on agent-first products and developer tools. He speaks about Agent Experience (AX), evaluating software with and for LLM agents, patterns and practices of the high-autonomy agentic SDLC, and AI code review. He co-organizes All Things Web, a San Francisco developer community, and previously led mobile and Applied AI teams at Cisco Meraki.","links":["https://www.coderabbit.ai","https://x.com/esthor"]},"fabian-hedin":{"name":"Fabian Hedin","affiliation":"Lovable","bio":"Fabian Hedin is an accomplished entrepreneur and technology leader with a diverse background in founding and leading innovative companies. As Co-Founder of Lovable, Founder and CEO of Tentium, and Founder and CTO of TenFAST, Fabian has demonstrated a strong ability to drive business growth and technological advancement. Experience as Frontend Lead at Depict and Fullstack Engineer at CurbFood further showcases Fabian's comprehensive skill set in software development and team leadership within the tech industry.","links":["https://github.com/fabhed"]},"francisco-javier-arceo":{"name":"Francisco Javier Arceo","affiliation":"Baseten","bio":"Francisco Javier Arceo is a Forward Deployed Engineer at Baseten and a contributor to vLLM Agentic API, connecting coding harnesses and agentic applications to open models across inference engines and serving stacks. He previously worked at Red Hat, Goldman Sachs, and Affirm, and has more than a decade of experience across AI, software engineering, and fintech.","links":["https://franciscojavierarceo.dev/","https://www.linkedin.com/in/franciscojavierarceo/","https://x.com/franciscojarceo"]},"frank-coyle":{"name":"Frank Coyle","affiliation":"UC Berkeley","bio":"Frank Coyle is a computer science educator with over thirty years of teaching experience, most recently as faculty at SMU and currently teaching Generative AI and Large Language Models at UC Berkeley and the University of Bologna. Frank is the founder of The AI Edge (codesupreme.ai), where he is launching Build to Certify, an eight-week cohort program preparing CS and engineering students for the Claude Certified Architect Foundations exam. His current focus is the practical craft of agentic AI engineering — tool design and MCP integration, context management, prompt engineering, and Claude Code workflows — taught through a hands-on \"MAKE before explain\" pedagogy. He is equally at home explaining tool-use loops to engineers and translating frontier AI concepts for audiences ranging from district attorneys to formerly-incarcerated students learning to code.","links":["https://frank-coyle.ai","https://www.linkedin.com/in/frank-coyle/","https://x.com/coyle_frankp"]},"george-fraser":{"name":"George Fraser","affiliation":"Fivetran","bio":"George Fraser is the CEO and co-founder of Fivetran, the global leader in the modern data movement. George founded Fivetran with Taylor Brown, the company’s Chief Operating Officer, in 2012 after completing the prestigious Y Combinator accelerator program. Under his leadership, Fivetran has grown from a startup into a global enterprise valued at $5.6 billion, serving thousands of companies worldwide to automate data workflows and drive innovation. He holds a PhD in Neurobiology from the University of Pittsburgh and a Bachelor of Science in Cognitive Science and Biology from Carnegie Mellon University.","links":["https://www.fivetran.com/","https://www.linkedin.com/in/george-fraser-a0219230/?isSelfProfile=false","https://x.com/frasergeorgew?lang=en"]},"giovanni-d-antonio":{"name":"Giovanni D'Antonio","affiliation":"Cognition","bio":"Giovanni is part of the Research Team at Cognition where he focuses on usability and coding RL. He most recently was working at Thinking Machines, and previously was part of frontier evals team at Google Deepmind.","links":["https://www.linkedin.com/in/giovanni-dantonio/"]},"ishaan-dey":{"name":"Ishaan Dey","affiliation":"Google DeepMind","bio":"Ishaan works on design and engineering for Antigravity at Google Deepmind.","links":["https://x.com/ishaandey_"]},"ivan-leo":{"name":"Ivan Leo","affiliation":"Google DeepMind","bio":"Ivan works on Developer Experience at Google DeepMind, where he focuses on making it easy to build on Gemini. Previously, he built general-purpose action engines for knowledge work at Manus (acquired by Meta) and worked on open-source libraries like Instructor which made it easy to get reliable structured outputs for language models using Pydantic.","links":["https://x.com/ivanleomk"]},"jacob-prall":{"name":"Jacob Prall","affiliation":"Render","bio":"Jacob Prall is a product and engineering leader with experience building developer tools across data infrastructure, cloud platforms, and AI. He is a Lead Developer Experience Engineer at Render and previously led product at SQLite.ai and developer education at Timescale. At Snowflake, he created the open-source AI-ready Data Framework. An educator at heart, he focuses on making complex technical ideas practical and accessible.⁠","links":["https://github.com/jacobprall","https://www.linkedin.com/in/jacob-prall-01abb867"]},"jakub-hojsan":{"name":"Jakub Hojsan","affiliation":"Exa","bio":"Jakub Hojsan works on deploying web search in AI agents and production applications. He joined Exa as its first forward deployed engineer in 2025, helping customers integrate search through pre-sales, implementation, and ongoing support. His technical focus addresses a practical weakness in coding assistants: a model can understand a codebase yet lack the newer documentation, library behavior, or breaking changes needed to make a sound decision.","links":[]},"james-arthur":{"name":"James Arthur","affiliation":"Databricks","bio":"Building Neon at Databricks. Previously CEO & Co-Founder of Electric. Prior to Electric, James co-founded the Post Urban venture builder and was co-founder and CTO of synthetic data company Hazy, digital manufacturing company Opendesk and developed software for companies including Apple and IDEO.","links":[]},"jarred-sumner":{"name":"Jarred Sumner","affiliation":"Anthropic","bio":"Jarred Sumner created Bun, the open-source JavaScript and TypeScript toolkit that combines a runtime, bundler, package manager, and test runner. What began as an attempt to shorten a 45-second development cycle became infrastructure for distributing coding agents. Jarred and the Bun team joined Anthropic in December 2025; his subsequent work includes directing an AI-assisted Rust rewrite designed to address recurring memory-management defects while preserving Bun’s behavior.","links":["https://github.com/Jarred-Sumner"]},"jason-liu":{"name":"Jason Liu","affiliation":"OpenAI","bio":"Jason Liu is the creator of Instructor, the open-source library that turns language-model responses into typed, validated objects, and a developer experience engineer on OpenAI’s Codex team. Instructor lets developers specify the data they need with familiar Python models, check business requirements in code, and return informative errors to the model when a response fails validation.","links":["https://github.com/jxnl","https://jxnl.co","https://www.linkedin.com/in/jxnlco","https://x.com/jxnlco"]},"jeffrey-pinner":{"name":"Jeffrey Pinner","affiliation":"Exa","bio":"Jeff Pinner is chief technology officer of Exa, where he works on search infrastructure for AI agents. His career spans contributions to HTTP/2, marketplace engineering at Lyft, and technology leadership at Robinhood. At Exa, he has highlighted historical web search as a way to backtest models and make evaluations reproducible.","links":["https://www.linkedin.com/in/jeff-pinner"]},"justin-mccarthy":{"name":"Justin McCarthy","affiliation":"Diffusion","bio":"Justin McCarthy is the founder and CEO of Diffusion. Previously, he co-founded StrongDM and served as CTO, where he built its Software Factory and spent a decade delivering cybersecurity infrastructure for demanding enterprises. He is now defining the frontier of agentic AI through the construction of Software and Demand Factories built for high-consequence settings.","links":["https://github.com/jmccarthy","https://www.linkedin.com/in/justinmccarthy","https://x.com/builtbyjustin"]},"justin-poehnelt":{"name":"Justin Poehnelt","affiliation":"Helen's Foundry","bio":"Justin Poehnelt is the founder and CTO of Helen’s Foundry, a startup building tools that help AI agents understand the strategy and intent behind software development. Before that, he spent nearly seven years as a software engineer at Google, where he created the open-source Google Workspace CLI. It went viral and, unexpectedly, got him fired.","links":["https://justin.poehnelt.com","https://www.linkedin.com/in/justin-poehnelt/","https://x.com/JPoehnelt"]},"karan-vaidya":{"name":"Karan Vaidya","affiliation":"Composio","bio":"Founder of Composio, building the infra for knowledge work agents","links":["https://kvaidya.com/","https://www.linkedin.com/in/kaavee315/","https://x.com/KaranVaidya6"]},"kent-c-dodds":{"name":"Kent C. Dodds","affiliation":"Independent","bio":"Kent C. Dodds is the creator of React Testing Library, an independent software engineer and educator who has shaped how developers test applications, build web products, and design AI assistants. His work spans influential JavaScript utilities, developer-education businesses, and Kody, an assistant designed to carry useful capabilities across applications.","links":["https://github.com/kentcdodds","https://kentcdodds.com","https://www.linkedin.com/in/kentcdodds","https://x.com/kentcdodds"]},"kevin-bernstein":{"name":"Kevin Bernstein","affiliation":"UiPath","bio":"Kevin Bernstein is a Solution Architect at UiPath, specializing in agentic AI, enterprise automation, and intelligent orchestration. With over a decade of experience designing and deploying automation solutions, he helps organizations bridge the gap between emerging AI capabilities and real-world business outcomes. His work focuses on building reliable, scalable AI systems that combine autonomous decision-making with deterministic execution and enterprise governance.","links":["https://www.uipath.com/"]},"khasimul-asif-mohammad":{"name":"Khasimul Asif Mohammad","affiliation":"Splunk","bio":"Asif is a Principal Product Manager at Splunk, a Cisco company, where he leads the product roadmap for AI Observability & Resilience (formerly Galileo). His team helps customers evaluate, monitor, guardrail and improve AI agents in production so they can ship reliable, trustworthy AI applications. He has several years of PM experience in scaling developer tools and infrastructure products at AWS, Splunk, and Freshworks, and founded a few startups. He is an angel investor in AI start-ups and a PM mentor.","links":["https://www.linkedin.com/in/khasimulasif/"]},"killian-carlsen-phelan":{"name":"Killian Carlsen-Phelan","affiliation":"Sonar","bio":"Killian Carlsen-Phelan is a software engineer who now works in developer-facing content. He has experience building full-stack apps and has spent a lot of time close to the platform side as well. At Sonar, he creates hands-on technical content for developers: tutorials, sample projects, demos, and blogs that show how to use SonarQube and other offerings in real workflows (IDE, pull requests, and CI pipelines). He likes taking something that feels confusing at first and turning it into clear steps that a developer can follow and trust.","links":["https://www.linkedin.com/in/kcarlsen2/"]},"lance-martin":{"name":"Lance Martin","affiliation":"Anthropic","bio":"Lance Martin is a member of technical staff at Anthropic, where his work includes Claude Managed Agents. Previously part of LangChain’s founding engineering team, he builds research agents, evaluation tools, and teaching materials. His development of open-deep-research captures a defining concern: the workflows that compensate for a model’s weaknesses can become obstacles when its capabilities improve.","links":["https://github.com/rlancemartin","https://rlancemartin.github.io","https://www.linkedin.com/in/lance-martin-64a33b5","https://x.com/rlancemartin"]},"lauren-tan":{"name":"Lauren Tan","affiliation":"SpaceXSI (xAI)","bio":"Lauren is a Principal Engineer at SpaceXSI where she works on Grok Bot and client architecture. She enjoys dropping cheeky memes in chat, playing video games with her partner, learning Korean, and petting her dogs Zelda and Link.","links":["https://github.com/poteto","https://www.linkedin.com/in/laurenelizabethtan"]},"louis-walsh":{"name":"Louis Walsh","affiliation":"Exa","bio":"Louis Walsh is a Forward Deployed Engineer at Exa in San Francisco and the developer of Exa for Shopping, a browser extension that uses Exa’s search API to bring price comparisons, retailer alternatives, and independent reviews to shoppers considering a product.","links":[]},"lucas-meijer":{"name":"Lucas Meijer","affiliation":"AgentsInTheCloud.com","bio":"Lucas Meijer helped build Unity from a 10-person startup into a 20B public company, as a hacker, an executive and the public face of the engine along the way. He's trying to figure out how to make software in this new world, and wrote agentsinthecloud.com along the way.","links":["https://lucasmeijer.com","https://x.com/lucasmeijer"]},"luke-alvoeiro":{"name":"Luke Alvoeiro","affiliation":"Factory","bio":"Luke Alvoeiro leads core agent at Factory. He builds Droid, the harness behind every Factory surface, and Missions, its multi-agent orchestration system. Before Factory, he co-created goose, Block's open-source AI agent. He focuses on making agents efficient and reliable enough for teams to hand off real work.","links":["https://github.com/lukealvoeiro","https://www.linkedin.com/in/lukealvoeiro"]},"lydia-hallie":{"name":"Lydia Hallie","affiliation":"Anthropic","bio":"Lydia Hallie is a Member of Technical Staff at Anthropic, working on developer relations for Claude Code. She creates technical content, talks, and workshops that help developers understand how Claude Code works and how to use it effectively.","links":["https://github.com/lydiahallie"]},"melvin-johnson":{"name":"Melvin Johnson","affiliation":"Google DeepMind","bio":"Melvin Johnson is a Vice President of Research at Google DeepMind, where he leads Gemini Post-Training across reinforcement learning, reasoning, alignment, and agentic capabilities for the Gemini model family. Previously at Google Research, he helped build Google’s Neural Machine Translation system and pioneered zero-shot multilingual translation across 100+ languages in Google Translate. He holds an M.S. in Computer Science from Stanford University.","links":["https://www.linkedin.com/in/melvinjosej","https://x.com/melvinjohnsonp"]},"michael-liendo":{"name":"Michael Liendo","affiliation":"Auth0","bio":"As a Staff Developer Advocate at Auth0, I’ve had the opportunity to build applications, develop architectures, and speak around the world as a way to remain customer obsessed. Since my beginnings as a self-taught developer, I’ve been focused on simplifying complex scenarios so the barrier to entry becomes a door easily opened for new developers.","links":["https://github.com/FocusOtter","https://www.focusotter.com/","https://www.linkedin.com/in/focusotter/","https://www.youtube.com/@focus_otter","https://x.com/focusotter"]},"michelle-chen":{"name":"Michelle Chen","affiliation":"Cloudflare","bio":"Michelle Chen runs the AI Platform at Cloudflare on the product team. She first started at Cloudflare in 2019 as an intern, took a break to do consulting at McKinsey, and returned to Cloudflare to be Chief of Staff to Dane Knecht (CTO) before starting and taking on the AI Platform. She spends the rest of her time either contemplating design, fashion, literature or hanging out with her dog.","links":[]},"mihail-eric":{"name":"Mihail Eric","affiliation":"Monaco","bio":"I’m Head of AI at Monaco, a startup building the future AI-powered revenue platform for GTM teams, backed by Human Capital, Benchmark, and Founders Fund. I'm also an adjunct professor at Stanford, where I created and teach \"The Modern Software Developer\", the university's first course on AI software development. I've trained hundreds of engineers on AI coding principles and have advised dozens of global software teams on AI development. In past lives, I was a technical lead at Amazon Alexa where I built the first LLMs for the organization. I also founded a YC-backed AI coding company. Before that I started Confetti AI, a machine learning education startup that trained thousands of students globally and that I led until its acquisition in 2022. I love teaching. My resources and talks have been viewed 5M+ times on various channels. Some of my past presentations: https://www.youtube.com/watch?v=wEsjK3Smovw","links":["http://mihaileric.com","https://www.linkedin.com/in/mihaileric/","https://x.com/mihail_eric"]},"natalie-serrino":{"name":"Natalie Serrino","affiliation":"Gimlet Labs","bio":"Natalie Serrino is a co-founder of Gimlet Labs and an engineering leader behind KForge, a system that uses AI to generate and optimize the specialized kernels powering machine-learning workloads across different processors. Her work tackles a central obstacle to efficient AI infrastructure: applications increasingly span multiple models, tools, and computational stages, yet adapting their software to unfamiliar accelerators requires scarce systems expertise. Serrino studied computer engineering at Brown University, where she helped establish Spira, an engineering program for high-school girls supported by the National Science Foundation. She subsequently became a founding engineer at Observe and Pixie Labs. Following Pixie’s acquisition by New Relic in 2020, she worked there as a principal engineer, developing infrastructure observability techniques including Kubernetes autoscaling based on application-specific HTTP traffic. At Gimlet, which launched publicly in October 2025, Serrino applies that operational background to heterogeneous inference orchestration: assigning individual stages of agentic applications to processors suited to their distinct computational and memory requirements.","links":["https://gimletlabs.ai/blog","https://www.linkedin.com/in/natalieserrino/","https://x.com/nserrino"]},"nikhil-harithas":{"name":"Nikhil Harithas","affiliation":"Factory","bio":"Nikhil Harithas led deployed engineering at Factory when he presented its approach to running coding agents on customer infrastructure. His examples come from teams whose policies govern both where code executes and whose credentials an agent can use. Harithas explains how Factory separated Droid’s control plane from the machines doing the work. A gateway and relay let a customer choose its compute, while model keys, snapshots and forks address distinct questions about authorization and what happens to an environment when an agent resumes or branches a task.","links":["https://www.linkedin.com/in/hurrythas"]},"owen-kephart":{"name":"Owen Kephart","affiliation":"Vercel","bio":"Owen Kephart is a Member of Technical Staff at Vercel, where he works on eve, Vercel’s agent framework.","links":[]},"patrick-debois":{"name":"Patrick Debois","affiliation":"Tessl","bio":"Godfather of Devops, working on shaping the next wave of Software delivery with AI","links":["https://jedi.be/blog","https://twitter.com/patrickdebois","https://www.linkedin.com/in/patrickdebois/"]},"philip-kiely":{"name":"Philip Kiely","affiliation":"Baseten","bio":"Philip Kiely is the author of Inference Engineering and works on special projects at Baseten. Outside of work, you'll find Philip practicing martial arts, reading a new book, or cheering for his adopted bay area sports teams.","links":["https://linkedin.com/in/philipkiely","https://philipkiely.com","https://twitter.com/philipkiely"]},"philipp-schmid":{"name":"Philipp Schmid","affiliation":"Google DeepMind","bio":"Philipp Schmid is a Senior AI Developer Relations Engineer at Google DeepMind working on Gemini, Gemma with the mission to help every developer and builder to create and benefit from AI in a responsible way.","links":["https://www.linkedin.com/in/philipp-schmid-a6a2bb196/","https://www.philschmid.de/","https://x.com/_philschmid"]},"quinn-slack":{"name":"Quinn Slack","affiliation":"Amp","bio":"Quinn Slack is the co-founder and chief executive of Amp, the coding-agent company, and the co-founder and former chief executive of Sourcegraph, the enterprise code-search business. His career traces the evolution of developer tools from searching unfamiliar codebases to building AI systems that can understand, modify, and evaluate software.","links":["https://github.com/sqs","https://slack.org/","https://www.linkedin.com/in/quinnslack","https://x.com/sqs"]},"raz-berman-gold":{"name":"Raz Berman Gold","affiliation":"Overcut","bio":"Raz Berman is Co-Founder & CTO of Overcut, building the enterprise control plane for agentic software development. Before Overcut she spent ~10 years at Microsoft, most recently as a Principal Software Engineering Group Manager leading a ~20-person Edge AI team and owning Azure Video Indexer service. She works hands-on with teams rolling AI into their production SDLC — the source of this talk.","links":["https://overcut.ai/","https://www.linkedin.com/in/raz-berman-software-engineering-group-manager"]},"richelle-ji":{"name":"Richelle Ji","affiliation":"Featherless AI","bio":"Richelle Ji helped build SF Tech Week Signal, a guide that lets readers filter a crowded event calendar by what they want to do.","links":[]},"ross-cefalu":{"name":"Ross Cefalu","affiliation":"Factory","bio":"Ross Cefalu co-founded Lumetric with Davis Palmie to build AI workflows for deal teams.","links":["https://www.linkedin.com/in/rcefalu"]},"sajid-mehmood":{"name":"Sajid Mehmood","affiliation":"Niteshift","bio":"Sajid Mehmood is the co-founder and CEO of Niteshift, the full-stack cloud for coding agents. Backed by Greylock, Amplify, and BoxGroup, Niteshift lets engineers run any frontier coding agent in the cloud with their full dev environment for end-to-end verification. Previously, Sajid was VP of Engineering at Datadog, where he launched several product lines, including Serverless Monitoring, Network Performance Monitoring, and Cloud Cost Management. He also started and oversaw Datadog's Applied AI group, which trained the state-of-the-art time-series foundation models Toto and Toto 2 and shipped Bits SRE, one of the first developer-facing AI agents, launched in August 2023. Before Datadog, Sajid was the founding CTO of fintech unicorn Taptap Send and a software engineer at Google, where he worked on cross-datacenter networking. He graduated summa cum laude from Princeton with a BSE in Computer Science, where he published research on data visualization and computational biology.","links":["https://x.com/smehmood"]},"scott-roberts":{"name":"Scott Roberts","affiliation":"Workday","bio":"Scott Roberts is scheduled to represent Workday as a keynote speaker at the [2026 AI Engineer Code Summit](https://ai.engineer/code/2026/schedule?session=1376198) in San Francisco in November.","links":[]},"scott-tolinski":{"name":"Scott Tolinski","affiliation":"Syntax","bio":"Co-host of the most popular web development podcast in the world, Scott Tolinski has been teaching coding on Youtube since 2012.","links":[]},"simon-willison":{"name":"Simon Willison","affiliation":"Independent","bio":"Simon Willison is the creator of Datasette, a co-creator of the Django web framework, and an independent open-source developer whose work spans data journalism, SQLite, and practical AI engineering. He builds tools that make powerful systems more accessible and inspectable while exposing the security risks of giving language models access to sensitive information.","links":["https://github.com/simonw","https://simonwillison.net","https://x.com/simonw"]},"stephen-chin":{"name":"Stephen Chin","affiliation":"Neo4j","bio":"Stephen Chin is VP of Developer Relations at Neo4j, AAIF ambassador, program chair and board member for the LF AI & Data Foundation, and author of numerous titles including the upcoming GraphRAG: The Definitive Guide for O'Reilly. He has given keynotes at numerous conferences around the world including AI Engineer World’s Fair, The AI Conference, AI DevSummit, Open Source Summit, Devoxx, Jfokus, DevNexus, JNation, JavaOne, Shift, Joker, swampUP, and GIDS. Stephen is an avid motorcyclist who has done evangelism tours in Europe, Japan, and Brazil, interviewing developers in their natural habitat. When he is not traveling, he enjoys teaching kids how to do AI, embedded, and robot programming together with his daughters.","links":["http://steveonjava.com/","https://twitter.com/steveonjava","https://www.linkedin.com/in/steveonjava/"]},"steve-yegge":{"name":"Steve Yegge","affiliation":"Independent","bio":"Steve Yegge is a software engineer, writer, and independent AI adviser who created Beads and Gas Town, open-source tools that preserve coding agents’ work and coordinate their sessions. Earlier, he built Google’s internal code knowledge graph, Grok, and wrote the Platforms Rant. His recent work puts his enthusiasm for autonomous development through the demands of a live multiplayer game: agents must carry assignments across sessions, integrate their changes, and serve players who may not welcome every increase in development speed.","links":["https://github.com/steveyegge","https://www.linkedin.com/in/steveyegge","https://x.com/steve_yegge","https://yegge.ai/"]},"sudhir-tonse":{"name":"Sudhir Tonse","affiliation":"Splunk","bio":"Sudhir Tonse is a Director of Engineering at Splunk, part of Cisco, where he leads Core Platform & Research for AI Observability and Resilience. His work focuses on helping organizations understand and trust AI systems in production, with an emphasis on the observability, resilience, and security foundations needed to identify risks and build dependable AI applications. Sudhir has more than two decades of experience building engineering teams and platforms across AI/ML, data, cloud infrastructure, and large-scale software. Before joining Splunk, he was Vice President of Engineering at Galileo, an AI startup focused on evaluating and observing generative AI systems that was later acquired by Splunk. At DoorDash, he built and led the Data and AI/ML Platform organization, growing it to more than 100 people and establishing a platform roadmap supporting logistics, recommendations, and other use cases. At Uber, he led engineering in the Marketplace and Data + AI domains during a period of rapid growth. At Netflix, he contributed to the transitions from DVD to streaming and from on-premises systems to the cloud. Sudhir enjoys sharing lessons from building AI platforms through talks and writing, and mentoring engineering leaders.","links":[]},"swyx":{"name":"swyx","affiliation":"AI Engineer","bio":"swyx, also known as Shawn Wang, is the co-founder and chief executive of AI Engineer, editor and podcast co-host of Latent Space, and founder of Smol AI.","links":["https://x.com/swyx"]},"sydney-runkle":{"name":"Sydney Runkle","affiliation":"LangChain","bio":"Sydney Runkle is LangChain’s open-source product manager and a former lead maintainer of Pydantic, the Python data validation library.","links":[]},"taylor-luttrell-williams":{"name":"Taylor Luttrell-Williams","affiliation":"Sonar","bio":"Taylor Luttrell-Williams is a Developer Content Engineer at Sonar, where he leverages a background in full stack software development and DevOps, and a passion for teaching, to produce deep, technical content. He connects Sonar’s products to the global developer community, shaping how practitioners approach code quality and security, through hands-on educational content, such as technical tutorials, blogs, and videos. Taylor is based in Austin, Texas.","links":["https://www.linkedin.com/in/taylor-g-l-7043b6186/","https://www.sonarsource.com/products/sonarqube/"]},"tejas-kumar":{"name":"Tejas Kumar","affiliation":"IBM","bio":"Tejas Kumar is an AI Engineer at IBM, based in Berlin, Germany. He is the best selling author of Fluent React (O'Reilly) and the host of the ConTejas Code podcast. He has been building on the web for over 25 years and has given 80 recorded talks at 64 events since 2012. He speaks on AI engineering, agent harnesses, React and the web platform. Recordings, topics and booking: https://tej.as/speaking","links":["https://github.com/tejasq","https://instagram.com/tejaslikecontagious","https://tejaskumar.com","https://www.linkedin.com/in/tejasq","https://x.com/TejasKumar_","https://x.com/tejaskumar_"]},"thariq-shihipar":{"name":"Thariq Shihipar","affiliation":"Independent","bio":"Thariq Shihipar is an independent engineer who worked on Claude Code at Anthropic. He left Anthropic in October 2026 after more than a year on the team. His contributions included AskUserQuestion, the tool that presents structured questions when an agent needs to clarify a user's requirements. Before Anthropic, Thariq co-founded scholarly publishing platform PubPub and led gaming company One More Multiverse. His current work explores how tools and interfaces let agents accomplish tasks—and help people understand the decisions made along the way.","links":["https://github.com/thariqs","https://www.linkedin.com/in/thariqshihipar","https://www.thariq.io","https://x.com/trq212"]},"theodor-marcu":{"name":"Theodor Marcu","affiliation":"Cognition","bio":"Theodor Marcu is the Head of Product Growth at Cognition.","links":["https://cognition.ai","https://x.com/theodormarcu"]},"thor-schaeff":{"name":"Thor Schaeff","affiliation":"Google DeepMind","bio":"Thor Schaeff works on developer experience at Google DeepMind, helping developers build with the Gemini API and Google AI Studio. His work teaches through inspectable applications: semantic search that runs inside a browser, voice agents adapted to model and speech constraints, and conversational interfaces that call tools to generate images or music.","links":["https://github.com/thorwebdev","https://thor.bio","https://www.linkedin.com/in/thorwebdev","https://x.com/thorwebdev"]},"utkarsh-shrivastava":{"name":"Utkarsh Shrivastava","affiliation":"Netflix","bio":"Utkarsh Shrivastava leads engineering for enterprise AI at Netflix, overseeing enterprise search, internal assistants, and the platforms that support them. His teams build and operate AI agents, with responsibility for integrations, evaluation, and governance. He focuses on scaling AI across the company: setting platform strategy, clarifying ownership, and bringing teams together around shared standards for quality and reliability.","links":["https://www.linkedin.com/in/utkarshshrivastava","https://www.netflix.com/"]},"walden-yan":{"name":"Walden Yan","affiliation":"Cognition","bio":"Walden Yan is a co-founder of Cognition, the company behind Devin, an autonomous software-engineering agent. His work spans neural program synthesis and the design of agents that carry out extended engineering tasks. His writing explains a particular difficulty in that progression: agents can produce individually plausible changes that conflict when combined, because each change carries decisions about how the software should work.","links":["https://github.com/walnutwaldo","https://walnutwaldo.github.io/","https://x.com/walden_yan"]},"yacine-mahdid":{"name":"Yacine Mahdid","affiliation":"Datadom","bio":"Yacine Mahdid is the CEO of Datadom and an entrepreneur and researcher with a keen interest in machine learning. He writes \"learning with yacine\", a newsletter untangling deep learning and the brain.","links":["https://www.linkedin.com/in/yacinemahdid/","https://www.yacinemahdid.com/about"]},"zach-bruggeman":{"name":"Zach Bruggeman","affiliation":"Ramp","bio":"Zach Bruggeman is a Principal Software Engineer at Ramp, leading the efforts on Inspect, Ramp's coding agent. In practice, this means he spends a lot of time talking to robots, but still prefers the humans after all.","links":["https://github.com/remixz"]},"zach-lloyd":{"name":"Zach Lloyd","affiliation":"Warp","bio":"Zach Lloyd is the founder and CEO of Warp, where his work has progressed from redesigning the terminal to helping developers direct, supervise, and improve AI coding agents. A former principal engineer who led Google Sheets and engineering across the Google Docs suite, he emphasizes product-first engineering: judging technical decisions by whether they help people build useful, working software.","links":["https://github.com/zachlloyd","https://www.linkedin.com/in/zachlloyd/","https://www.warp.dev/","https://x.com/zachlloydtweets"]}},"untitled":["1373478","1373482"],"gaps":["coverage-gap: entry page states '7 streamed' online talks (Kush Agrawal, Prasanna Sankar, Preetam Dwivedi, Manjari Akella, Nouha Dziri, Tanmay Sah, Dolly Sah, Ari Azarafrooz, Rohan Pandey); 0 of the 7 are in the schedule data and the site publishes no title or time for them, so they are not in program.sessions","schedule data omits entry-page speakers with no scheduled session: Alex Polozov, David Roster, Joe Spisak, Lukas Frei","stated_session_count null: neither the entry page nor the schedule route states a session total, so completeness of 112 cannot be reconciled against one","sessions 'Token Billionaires Lounge' (2026-11-11, 2026-11-12, Continental 7) and 'Expo Hall Hours' (2026-11-11, 2026-11-12, Golden Gate): source type 'other', no speaker and no description; format null because the source does not establish one","session 'AIE x MLH Hackathon' ends_at follows the official page (9 PM PT); its linked Luma page says 6 PM PT","session 'allthings/aie': off-site place not published; const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const $ = (id) => document.getElementById(id);
const btn = (cls, text, fn) => { const b = el("button", cls, text); b.type = "button"; b.addEventListener("click", fn); return b; };
const safeUrl = (u) => (/^https?:\/\//i.test(u || "") ? u : null);
const extLink = (text, url) => { const a = el("a", null, text); a.href = url; a.target = "_blank"; a.rel = "noopener"; return a; };

const rooms = new Map(DATA.venue.rooms.map((r) => [r.room_id, r]));
const byId = new Map(DATA.sessions.map((s) => [s.id, s]));
const untitled = new Set(DATA.untitled);
const CALLS = DATA.recommendations?.calls || {};
const CALL_LABEL = { go: "Go", maybe: "Could go either way", skip: "Skip" };
const FORMAT_LABEL = { talk: "Talk", keynote: "Keynote", panel: "Panel", workshop: "Workshop", break: "Break", registration: "Registration", social: "Social", "side-event": "Side event" };
const QUIET = new Set(["break", "registration"]);

// Times stay in the event's zone: read the wall clock from the offset-qualified string.
const clock = (iso) => {
  let h = +iso.slice(11, 13); const m = iso.slice(14, 16); const ap = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12; return `${h}:${m} ${ap}`;
};
const span = (s) => `${clock(s.start)}–${clock(s.end)}`;
const dayName = (date, style) => new Date(date + "T12:00:00Z").toLocaleDateString("en-US", { timeZone: "UTC", ...style });
const shortDay = (date) => dayName(date, { weekday: "short", month: "short", day: "numeric" });
const at = (iso) => Date.parse(iso);
const overlaps = (a, b) => a.id !== b.id && at(a.start) < at(b.end) && at(b.start) < at(a.end);
const zoneName = (style) => new Intl.DateTimeFormat("en-US", { timeZone: DATA.event.timezone, timeZoneName: style })
  .formatToParts(new Date(DATA.event.starts_on + "T12:00:00Z")).find((p) => p.type === "timeZoneName").value;
const floorOf = (s) => rooms.get(s.room)?.floor || null;
const roomText = (s) => rooms.get(s.room)?.name || (s.note ? `Off-site: ${s.note}` : "Location not published");
const whereText = (s) => (floorOf(s) ? `${roomText(s)} · ${floorOf(s)}` : roomText(s));
const speakerNames = (s) => s.speakers.map((id) => {
  const p = DATA.speakers[id]; if (!p) return id;
  return p.affiliation ? `${p.name} (${p.affiliation})` : p.name;
}).join(", ");
const canPick = (s) => !QUIET.has(s.format);

/* ---- Your plan: go or skip per session. Kept in this browser first, so it works on bad
   conference wifi, and in your account when the viewer provides one. ---- */
const SLUG = String(DATA.event.name).toLowerCase().replace(/[^a-z0-9]+/g, "-");
const PLAN_KEY = `${SLUG}-plan`, OLD_STARS_KEY = `${SLUG}-stars`;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let plan = (() => {
  try {
    const saved = JSON.parse(store.get(PLAN_KEY) || "null");
    if (saved?.picks) return saved;
  } catch {}
  // Stars from the earlier version of this guide carry over as calendar picks.
  const picks = {};
  try { for (const id of JSON.parse(store.get(OLD_STARS_KEY) || "[]")) if (byId.has(id)) picks[id] = "go"; } catch {}
  return { picks, updatedAt: 0 };
})();
let syncMode = "local", planDoc = null, pushTimer = null, pushing = false, pushAgain = false;

function renderSync() {
  $("sync").textContent = syncMode === "account" ? "Your plan follows your account across devices" : "Your plan is saved in this browser only";
}
async function pushPlan() {
  if (!planDoc) return;
  if (pushing) { pushAgain = true; return; }
  pushing = true;
  try { await planDoc.set({ picks: plan.picks, updatedAt: plan.updatedAt }); syncMode = "account"; }
  catch { syncMode = "local"; }
  pushing = false; renderSync();
  if (pushAgain) { pushAgain = false; pushPlan(); }
}
function savePlan() {
  plan.updatedAt = Date.now();
  store.set(PLAN_KEY, JSON.stringify(plan));
  clearTimeout(pushTimer); pushTimer = setTimeout(pushPlan, 500);
}
async function connectAccount() {
  if (!window.claude?.use) return;
  const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  if (!db || !user) return;
  const id = await user.id();
  if (!id) return;
  planDoc = db.doc(`plans/${id}`);
  planDoc.onSnapshot((snap) => {
    syncMode = "account"; renderSync();
    const remote = snap.exists ? snap.data() : null;
    if (remote && Number(remote.updatedAt) > plan.updatedAt) {
      plan = { picks: { ...(remote.picks || {}) }, updatedAt: Number(remote.updatedAt) };
      store.set(PLAN_KEY, JSON.stringify(plan));
      render();
    } else if (plan.updatedAt > Number(remote?.updatedAt || 0) || (!remote && Object.keys(plan.picks).length)) {
      pushPlan();
    }
  }, () => { syncMode = "local"; renderSync(); });
}

const pickOf = (id) => plan.picks[id] || null;
const myGoes = () => DATA.sessions.filter((s) => pickOf(s.id) === "go").sort((a, b) => at(a.start) - at(b.start));
const clashesOf = (s) => myGoes().filter((o) => overlaps(s, o));

let lastAction = null;
function decide(id, value) {
  const before = pickOf(id);
  if (value) plan.picks[id] = value; else delete plan.picks[id];
  lastAction = { id, before, value };
  savePlan();
}
function undo() {
  if (!lastAction) return;
  const { id, before } = lastAction;
  if (before) plan.picks[id] = before; else delete plan.picks[id];
  state.current = id; lastAction = null;
  savePlan(); render();
}

/* ---- View state ---- */
const VIEWS = ["go-through", "talks", "calendar", "map"];
const state = { view: "go-through", flowDay: null, current: null, later: new Set(), talksDay: null, q: "", filter: "", mapDay: null, floor: "Level 2", looked: null, zoom: false };

function homeDay() {
  const today = new Date().toLocaleDateString("en-CA", { timeZone: DATA.event.timezone });
  return DATA.days.some((d) => d.date === today) ? today : DATA.days[0].date;
}
function setView(v, { top = true } = {}) {
  state.view = v;
  if (location.hash.slice(1) !== v) { try { location.hash = v; } catch {} }
  render();
  if (top) document.querySelector(".nav").scrollIntoView({ block: "start", behavior: "auto" });
}
function showOnMap(s) {
  state.looked = s.id; state.mapDay = s.day;
  if (floorOf(s)) state.floor = floorOf(s);
